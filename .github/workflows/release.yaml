name: Release

# releases Marshal with semantic-release from a manual dispatch on main, and on
# nothing else. docs/operations/cli.md describes the seven jobs and
# docs/conventions/security.md the controls and residual risks. it runs on
# GitHub-hosted runners only.
#
# plan works out the version and build makes the unsigned set and the unsigned
# Mac app. sign-macos then signs the Mac app and notarizes and staples its disk
# image in the `release` Environment, which the maintainer restricts to main and
# approves for each run. it is the only job that declares an Environment or reads a
# signing secret, it checks nothing out and runs no repository file, no package
# manager and no action but GitHub's artifact transfer, and it calls each tool by
# its absolute system path. verify-macos checks the signed disk image without the
# Environment. assemble-signed is where every file of the release meets: it checks
# the build's set and the signed disk image and writes SHA256SUMS over them, and
# attest and release read only what it uploads. every signing step comes before
# release, so a failure stops the run before any tag.
# .github/scripts/check-release-shape.mjs, which `mise run check` runs, fails if
# these jobs drift from that shape; docs/operations/cli.md says how W4 extends
# them.

on:
  workflow_dispatch:

# one release at a time, never cancelled: a run stopped between pushing the tag
# and publishing would leave a tag without its release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan The Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # the same Node as mise.toml, which Dependabot does not bump here.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install semantic-release
        working-directory: release
        run: npm ci --ignore-scripts
      # verify-release.sh writes the version to this step's outputs; with nothing
      # to release it never runs, so the output stays empty.
      - name: Work Out The Next Version
        id: plan
        working-directory: release
        env:
          RELEASE_PHASE: plan
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no -- semantic-release --dry-run

  build:
    name: Build
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.version != ''
    uses: ./.github/workflows/release-build.yaml
    permissions:
      contents: read
    with:
      version: ${{ needs.plan.outputs.version }}

  # the only job that declares an Environment or reads a signing secret. it holds
  # contents: read, checks nothing out, runs no repository file and no package
  # manager, and uses no action but GitHub's artifact transfer. every context
  # value reaches a script through `env:`, never inside `run:`, and each tool is
  # called by its absolute system path through a prefix variable whose default is
  # the literal /usr/bin, which only the stand-in test overrides. the first line of
  # each script names it for that test, which runs the scripts against recording
  # stand-ins of the macOS tools. the keychain password and secrets reach
  # `security` as arguments, the one exception to "no secret on a command line"
  # that docs/conventions/security.md records. it takes the unsigned Mac app from
  # the build's app job, signs it, and builds, signs, notarizes and staples the
  # disk image the release publishes.
  sign-macos:
    name: Sign And Notarize The Mac App
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.version != ''
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    outputs:
      macos_dmg_sha256: ${{ steps.hash.outputs.dmg_sha256 }}
      team_id: ${{ steps.identities.outputs.team_id }}
      submission_id: ${{ steps.notarize.outputs.submission_id }}
    steps:
      - name: Download The Unsigned Mac App
        timeout-minutes: 3
        uses: actions/download-artifact@v8
        with:
          name: marshal-macos-app
          path: unsigned
      # refuses before anything is imported: an empty secret or team ID (the
      # Environment is missing or incomplete), a version that is not X.Y.Z, any file
      # but the app archive and the build's unsigned disk image, an archive whose
      # hash is not the app job's app_sha256, or a tool that is not where the job
      # calls it. the build's disk image is not used; this job makes its own.
      - name: Check The Secrets, The Files And The Tools
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          APP_SHA256: ${{ needs.build.outputs.app_sha256 }}
          MACOS_APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          # sign-macos: check
          set -euo pipefail
          : "${SYSTEM_BIN:=/usr/bin}"

          refuse() {
            echo "error: $*" >&2
            exit 1
          }

          # names only; no value is ever printed.
          empty=""
          for name in MACOS_APPLICATION_P12_BASE64 MACOS_P12_PASSWORD MACOS_NOTARY_KEY_P8 MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID MACOS_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              empty="${empty} ${name}"
            fi
          done
          if [[ -n "$empty" ]]; then
            refuse "these secrets or variables are empty:${empty}; the release Environment is missing or incomplete"
          fi
          team_pattern='^[A-Z0-9]{10}$'
          [[ "$MACOS_TEAM_ID" =~ $team_pattern ]] || refuse "MACOS_TEAM_ID is not a 10-character team ID"

          number='(0|[1-9][0-9]*)'
          [[ "$VERSION" =~ ^${number}\.${number}\.${number}$ ]] || refuse "the version '${VERSION}' is not X.Y.Z"
          hash_pattern='^[0-9a-f]{64}$'
          [[ "$APP_SHA256" =~ $hash_pattern ]] || refuse "the build's app_sha256 '${APP_SHA256}' is not a SHA-256"

          # every tool the job calls, by the path it calls it at.
          bin_tools="security codesign openssl plutil shasum xcrun ditto hdiutil"
          for tool in $bin_tools; do
            [[ -x "$SYSTEM_BIN/${tool}" ]] || refuse "$SYSTEM_BIN/${tool} is missing"
          done
          for tool in notarytool stapler; do
            "$SYSTEM_BIN/xcrun" --find "$tool" >/dev/null || refuse "xcrun cannot find ${tool}"
          done

          archive="marshal-${VERSION}-macos-arm64-app.zip"
          build_image="marshal-${VERSION}-macos-arm64.dmg"
          expected="$(printf '%s\n' "$archive" "$build_image" | LC_ALL=C sort)"
          present="$(find unsigned -mindepth 1 -maxdepth 1 | sed 's|^unsigned/||' | LC_ALL=C sort)"
          if [[ "$present" != "$expected" ]]; then
            refuse "the downloaded files are not exactly ${archive} and ${build_image}:
          ${present}"
          fi
          if [[ -L "unsigned/${archive}" || ! -f "unsigned/${archive}" ]]; then
            refuse "${archive} is not a regular file"
          fi
          line="$("$SYSTEM_BIN/shasum" -a 256 "unsigned/${archive}")"
          have="${line%% *}"
          [[ "$have" == "$APP_SHA256" ]] || refuse "${archive} has SHA-256 ${have}, not the ${APP_SHA256} that the app job output"

          echo "The secrets, the app archive for ${VERSION} and the tools are all present."
      # the temporary keychain holds the Developer ID Application identity and Apple's
      # Developer ID G2
      # intermediate certificate, which is embedded here because the runner image's
      # trust in it is unknown and this job fetches nothing. it is Apple's
      # DeveloperIDG2CA.cer, fetched from
      # https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer on
      # 2026-11-03 over TLS, valid until 2031-09-17. the job refuses it unless its
      # SHA-256 equals the pin, which docs/conventions/security.md also records.
      - name: Create The Keychain And Import The Certificates
        env:
          MACOS_APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          # sign-macos: keychain
          set -euo pipefail
          : "${SYSTEM_BIN:=/usr/bin}"

          refuse() {
            echo "error: $*" >&2
            exit 1
          }

          # everything the job writes sits in $dir, which the clean-up step removes
          # with the keychain, and only its owner can read it.
          umask 077
          dir="${RUNNER_TEMP}/marshal-signing"
          keychain="${RUNNER_TEMP}/marshal-signing.keychain-db"
          mkdir -p "$dir"

          g2_sha256="f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          g2_base64="MIIEPjCCAyagAwIBAgIUf7QAP82XSXrLg02SpIp4c8KEXUMwDQYJKoZIhvcNAQELBQAwYjELMAkGA1UEBhMCVVMxEzARBgNV"
          g2_base64+="BAoTCkFwcGxlIEluYy4xJjAkBgNVBAsTHUFwcGxlIENlcnRpZmljYXRpb24gQXV0aG9yaXR5MRYwFAYDVQQDEw1BcHBsZSBS"
          g2_base64+="b290IENBMB4XDTIxMDkyMjE4NTUxMFoXDTMxMDkxNzAwMDAwMFowXjEtMCsGA1UEAwwkRGV2ZWxvcGVyIElEIENlcnRpZmlj"
          g2_base64+="YXRpb24gQXV0aG9yaXR5MQswCQYDVQQLDAJHMjETMBEGA1UECgwKQXBwbGUgSW5jLjELMAkGA1UEBhMCVVMwggEiMA0GCSqG"
          g2_base64+="SIb3DQEBAQUAA4IBDwAwggEKAoIBAQDTLJVoIVSRir9lccIYTvbNDeGRKHXXA7qVH9MSmVJE3oBGZ/wpiwCFiIowh01Mbkq0"
          g2_base64+="x+UC49djTKrM6uzbQi+RfSXpX6RLKlRvF6wwnykoNKR/j+V4410jKiFG0InDX/hql51xGxiosgzJAwo1sgKnLfWz3BuDxSch"
          g2_base64+="QHKm5zd2Mee7Br90svZwrEysLc3JXkWLz/sI5mLVQJW1N1zMGw7h79yl5Y3JULdAnwojJUVAj5Rne+CU6jnTeKU00cLL4DN/"
          g2_base64+="LrYsw+Um1SXOqo0qd/yeFJaX4PVfLvLop3GnO6OZTHoio03vcBHV1oaBgvFnM5MzWkCxksSqc5YdxFz/4es3AgMBAAGjge8w"
          g2_base64+="gewwEgYDVR0TAQH/BAgwBgEB/wIBADAfBgNVHSMEGDAWgBQr0GlHlHYJ/vRrjS5ApvdHTX8IXjBEBggrBgEFBQcBAQQ4MDYw"
          g2_base64+="NAYIKwYBBQUHMAGGKGh0dHA6Ly9vY3NwLmFwcGxlLmNvbS9vY3NwMDMtYXBwbGVyb290Y2EwLgYDVR0fBCcwJTAjoCGgH4Yd"
          g2_base64+="aHR0cDovL2NybC5hcHBsZS5jb20vcm9vdC5jcmwwHQYDVR0OBBYEFPg6DGkRduDtrNHrpln6N9XEVbAeMA4GA1UdDwEB/wQE"
          g2_base64+="AwIBBjAQBgoqhkiG92NkBgIGBAIFADANBgkqhkiG9w0BAQsFAAOCAQEAwf1DClm/8bG3QxBa1hgyMBRWJuERSGMraXKXSB+O"
          g2_base64+="W8peJhX7dCOAM1QzGaEihlrYuEtpqqfOlpbCCsc1atBvzoppg2JtSjn1/oNN16LUiB/tiMAP+PkzHrQQt8JcETdENwSwpESd"
          g2_base64+="jGgNe30dfsy1k/DWbz0VeoCldNPhj33SiOgxp5jFH9/iglmugIFgRhbsnrmKQKobKuFhhgqMcA/ZSizsTKIFEdZ5jKVjJSEj"
          g2_base64+="Am+TW1pXoddFbd/M93+fX9vH7WSnb0Qvb009eHgKVrQ71zrIK2Wik+rbWOqO1LnEwDD8MhpNupIMJDmYgjqgmd7n5OS8DryF"
          g2_base64+="r1qrXND828wQww=="
          printf '%s' "$g2_base64" | base64 --decode >"${dir}/DeveloperIDG2CA.cer"
          line="$("$SYSTEM_BIN/shasum" -a 256 "${dir}/DeveloperIDG2CA.cer")"
          if [[ "${line%% *}" != "$g2_sha256" ]]; then
            refuse "the embedded Developer ID G2 certificate has SHA-256 ${line%% *}, not the pinned ${g2_sha256}"
          fi

          keychain_password="$("$SYSTEM_BIN/openssl" rand -hex 24)"
          echo "::add-mask::${keychain_password}"
          "$SYSTEM_BIN/security" create-keychain -p "$keychain_password" "$keychain"
          "$SYSTEM_BIN/security" set-keychain-settings -lut 21600 "$keychain"
          "$SYSTEM_BIN/security" unlock-keychain -p "$keychain_password" "$keychain"
          "$SYSTEM_BIN/security" list-keychains -d user -s "$keychain"

          printf '%s' "$MACOS_APPLICATION_P12_BASE64" | base64 --decode >"${dir}/application.p12"
          chmod 0600 "${dir}/application.p12"
          [[ -s "${dir}/application.p12" ]] || refuse "application.p12 is empty after decoding its secret"

          "$SYSTEM_BIN/security" import "${dir}/DeveloperIDG2CA.cer" -k "$keychain" -t cert
          "$SYSTEM_BIN/security" import "${dir}/application.p12" -k "$keychain" -f pkcs12 -P "$MACOS_P12_PASSWORD" -T "$SYSTEM_BIN/codesign"
          "$SYSTEM_BIN/security" set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          rm -f "${dir}/application.p12"
          echo "Imported the Developer ID G2 certificate and the Developer ID Application identity."
      - name: Select The Identity And Check Its Certificate
        id: identities
        env:
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          # sign-macos: identities
          set -euo pipefail
          : "${SYSTEM_BIN:=/usr/bin}"

          refuse() {
            echo "error: $*" >&2
            exit 1
          }

          umask 077
          dir="${RUNNER_TEMP}/marshal-signing"
          keychain="${RUNNER_TEMP}/marshal-signing.keychain-db"
          all="$("$SYSTEM_BIN/security" find-identity "$keychain")"
          valid="$("$SYSTEM_BIN/security" find-identity -v "$keychain")"
          echo "$all"

          # pick_identity <Application>: sets identity_hash and
          # identity_name to the one identity named "Developer ID <kind>: ...", and
          # refuses unless there is exactly one.
          identity_pattern='^[[:space:]]*[0-9]+\)[[:space:]]+([0-9A-Fa-f]{40})[[:space:]]+"([^"]*)"'
          pick_identity() {
            local kind="$1" line count=0
            identity_hash=""
            identity_name=""
            while IFS= read -r line; do
              if [[ "$line" =~ $identity_pattern ]]; then
                if [[ "${BASH_REMATCH[2]}" == "Developer ID ${kind}: "* ]]; then
                  count=$((count + 1))
                  identity_hash="${BASH_REMATCH[1]}"
                  identity_name="${BASH_REMATCH[2]}"
                fi
              fi
            done <<<"$all"
            [[ $count -eq 1 ]] || refuse "the keychain holds ${count} Developer ID ${kind} identities, not exactly one"
            if [[ "$valid" != *"$identity_hash"* ]]; then
              refuse "the Developer ID ${kind} identity is not valid in this keychain; its chain may be incomplete"
            fi
          }

          hash_pattern='^SHA-1 hash: ([0-9A-Fa-f]{40})[[:space:]]*$'

          # check_certificate <Application>: prints the subject, the team
          # and the expiry date of the certificate of the identity pick_identity
          # chose, refuses a certificate of another team or an expired one, and warns
          # within 90 days. find-certificate matches by name and lists the SHA-1 hash
          # of each certificate it finds, so the certificate checked is the one with
          # the identity's hash, and the name must match exactly one certificate, so
          # that what is checked is what codesign signs with.
          check_certificate() {
            local kind="$1" pem listing line have want found=0 selected=0 matched=0 details subject team ends
            pem="${dir}/${kind}.pem"
            listing="$("$SYSTEM_BIN/security" find-certificate -a -Z -c "$identity_name" -p "$keychain")" || refuse "the keychain holds no certificate named '${identity_name}'"
            want="$(printf '%s' "$identity_hash" | tr 'A-F' 'a-f')"
            : >"$pem"
            while IFS= read -r line; do
              if [[ "$line" =~ $hash_pattern ]]; then
                found=$((found + 1))
                selected=0
                have="$(printf '%s' "${BASH_REMATCH[1]}" | tr 'A-F' 'a-f')"
                if [[ "$have" == "$want" ]]; then
                  selected=1
                  matched=$((matched + 1))
                fi
              elif [[ $selected -eq 1 ]]; then
                printf '%s\n' "$line" >>"$pem"
              fi
            done <<<"$listing"
            [[ $found -eq 1 ]] || refuse "the keychain holds ${found} certificates named '${identity_name}', not exactly one"
            [[ $matched -eq 1 ]] || refuse "the certificate named '${identity_name}' does not have the SHA-1 hash ${identity_hash} of the Developer ID ${kind} identity"
            details="$("$SYSTEM_BIN/openssl" x509 -in "$pem" -noout -subject -enddate -nameopt RFC2253)"
            subject="$(printf '%s\n' "$details" | sed -n 's/^subject= *//p')"
            team="$(printf '%s\n' "$subject" | tr ',' '\n' | sed -n 's/^ *OU=//p')"
            ends="$(printf '%s\n' "$details" | sed -n 's/^notAfter=//p')"
            echo "Developer ID ${kind}: subject ${subject}; team ${team}; expires ${ends}"
            [[ "$team" == "$MACOS_TEAM_ID" ]] || refuse "the Developer ID ${kind} certificate names team '${team}', not MACOS_TEAM_ID"
            if ! "$SYSTEM_BIN/openssl" x509 -in "$pem" -noout -checkend 0 >/dev/null; then
              refuse "the Developer ID ${kind} certificate expired on ${ends}"
            fi
            if ! "$SYSTEM_BIN/openssl" x509 -in "$pem" -noout -checkend 7776000 >/dev/null; then
              echo "::warning::the Developer ID ${kind} certificate expires on ${ends}, within 90 days; renew it before the next release"
            fi
          }

          pick_identity Application
          application_identity="$identity_hash"
          check_certificate Application
          {
            echo "APPLICATION_IDENTITY=${application_identity}"
          } >>"$GITHUB_ENV"
          echo "team_id=${MACOS_TEAM_ID}" >>"$GITHUB_OUTPUT"
      # the layout the app job checked, again, since this job trusts only the hash.
      # the bundle may hold no nested code (Frameworks, PlugIns, Helpers,
      # XPCServices, Library, or a second executable in MacOS), so signing the
      # bundle, which signs its one executable with it, is the whole inside-out
      # order; a bundle that gains nested code fails here before anything is signed.
      - name: Unpack The App And Check Its Layout
        timeout-minutes: 3
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # sign-macos: unpack
          set -euo pipefail
          : "${SYSTEM_BIN:=/usr/bin}"

          refuse() {
            echo "error: $*" >&2
            exit 1
          }

          mkdir app
          "$SYSTEM_BIN/ditto" -x -k "unsigned/marshal-${VERSION}-macos-arm64-app.zip" app
          entries="$(find app -mindepth 1 -maxdepth 1 | sed 's|^app/||' | LC_ALL=C sort)"
          [[ "$entries" == "Marshal.app" ]] || refuse "the archive holds '${entries}', not only Marshal.app"
          contents="app/Marshal.app/Contents"
          executables="$(find "${contents}/MacOS" -mindepth 1 -maxdepth 1 | sed "s|^${contents}/MacOS/||" | LC_ALL=C sort)"
          [[ "$executables" == "marshal-app" ]] || refuse "Contents/MacOS holds '${executables}', not only marshal-app"
          for nested in Frameworks PlugIns Helpers XPCServices Library; do
            [[ ! -e "${contents}/${nested}" ]] || refuse "the app holds Contents/${nested}, nested code this job does not sign"
          done
          plist="${contents}/Info.plist"
          identifier="$("$SYSTEM_BIN/plutil" -extract CFBundleIdentifier raw -o - "$plist")"
          [[ "$identifier" == "app.axross.marshal" ]] || refuse "the app's identifier is '${identifier}', not app.axross.marshal"
          version="$("$SYSTEM_BIN/plutil" -extract CFBundleShortVersionString raw -o - "$plist")"
          [[ "$version" == "$VERSION" ]] || refuse "the app's version is '${version}', not ${VERSION}"
          echo "Unpacked Marshal.app ${version}, with marshal-app as its only code."
      # the signature takes the fixed identifier, as Keychain trust follows the
      # designated requirement, which must not change from release to release. the
      # requirement must be F0's form A (plain codesign's) or form B (Xcode's,
      # TN3127) for that identifier and MACOS_TEAM_ID; verify-macos checks it again.
      - name: Sign The App
        timeout-minutes: 5
        env:
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          # sign-macos: sign
          set -euo pipefail
          : "${SYSTEM_BIN:=/usr/bin}"

          refuse() {
            echo "error: $*" >&2
            exit 1
          }

          keychain="${RUNNER_TEMP}/marshal-signing.keychain-db"
          identifier="app.axross.marshal"
          app="app/Marshal.app"
          "$SYSTEM_BIN/codesign" --force --sign "$APPLICATION_IDENTITY" --keychain "$keychain" --options runtime --timestamp --identifier "$identifier" "$app"
          "$SYSTEM_BIN/codesign" --verify --strict --verbose=2 "$app"

          # normalized <requirement>: without /* */ comments, one space between
          # tokens and the team ID unquoted, the only ways codesign's text differs.
          normalized() {
            printf '%s\n' "$1" |
              sed -e 's|/\*[^*]*\*/||g' -e 's/[[:space:]][[:space:]]*/ /g' -e 's/^ //' -e 's/ $//' \
                -e 's/\(subject\.OU] = \)"\([A-Z0-9]*\)"/\1\2/'
          }
          # clauses <normalized requirement>: its clauses, one per line and sorted.
          clauses() {
            printf '%s\n' "$1" |
              awk '{ n = split($0, parts, / and /); for (i = 1; i <= n; i++) print parts[i] }' |
              LC_ALL=C sort
          }
          requirement="$("$SYSTEM_BIN/codesign" --display --requirements - "$app" 2>&1 | sed -n 's/^designated => //p')"
          [[ -n "$requirement" ]] || refuse "codesign printed no designated requirement for the app"
          form_a="anchor apple generic and identifier \"${identifier}\" and certificate 1[field.1.2.840.113635.100.6.2.6] and certificate leaf[field.1.2.840.113635.100.6.1.13] and certificate leaf[subject.OU] = ${MACOS_TEAM_ID}"
          form_b="anchor apple generic and identifier \"${identifier}\" and (certificate leaf[field.1.2.840.113635.100.6.1.9] or certificate 1[field.1.2.840.113635.100.6.2.6] and certificate leaf[field.1.2.840.113635.100.6.1.13] and certificate leaf[subject.OU] = ${MACOS_TEAM_ID})"
          have="$(normalized "$requirement")"
          want_b="$(normalized "$form_b")"
          want_a="$(normalized "$form_a")"
          have_clauses="$(clauses "$have")"
          want_clauses="$(clauses "$want_a")"
          if [[ "$have" == "$want_b" ]]; then
            form=B
          elif [[ "$have_clauses" == "$want_clauses" ]]; then
            form=A
          else
            refuse "the app's designated requirement is not the default one for ${identifier} and team ${MACOS_TEAM_ID} in form A or B: ${requirement}"
          fi
          echo "Signed the app; its designated requirement is form ${form}: ${requirement}"
      # the app job's hdiutil create arguments, repeated because this job runs no
      # repository file; check-release-shape.mjs fails if the two differ. the image
      # is signed under its own identifier with the Application identity.
      - name: Build And Sign The Disk Image
        timeout-minutes: 6
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # sign-macos: dmg
          set -euo pipefail
          : "${SYSTEM_BIN:=/usr/bin}"

          refuse() {
            echo "error: $*" >&2
            exit 1
          }

          keychain="${RUNNER_TEMP}/marshal-signing.keychain-db"
          stage="${RUNNER_TEMP}/marshal-dmg"
          image="signed/marshal-${VERSION}-macos-arm64.dmg"
          mkdir -p "$stage" signed
          "$SYSTEM_BIN/ditto" app/Marshal.app "${stage}/Marshal.app"
          ln -s /Applications "${stage}/Applications"
          attempt=1
          until "$SYSTEM_BIN/hdiutil" create -volname Marshal -srcfolder "$stage" -format UDZO -ov "$image"; do
            if [[ "$attempt" -ge 3 ]]; then
              refuse "hdiutil create failed ${attempt} times"
            fi
            echo "hdiutil create failed on attempt ${attempt}; trying again in 10 seconds"
            attempt=$((attempt + 1))
            sleep 10
          done
          "$SYSTEM_BIN/codesign" --force --sign "$APPLICATION_IDENTITY" --keychain "$keychain" --timestamp --identifier app.axross.marshal.dmg "$image"
          "$SYSTEM_BIN/codesign" --verify --strict --verbose=2 "$image"
          echo "Built and signed ${image}."
      # notarytool may exit non-zero, or zero, whatever Apple decided, so the
      # decision is the status in its JSON. the log is fetched whenever a
      # submission ID exists, and the next steps upload it even when this one fails.
      - name: Notarize The Disk Image
        id: notarize
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          # sign-macos: notarize
          set -euo pipefail
          : "${SYSTEM_BIN:=/usr/bin}"

          refuse() {
            echo "error: $*" >&2
            exit 1
          }

          umask 077
          dir="${RUNNER_TEMP}/marshal-signing"
          notary="${RUNNER_TEMP}/marshal-notary"
          mkdir -p "$notary"
          image="signed/marshal-${VERSION}-macos-arm64.dmg"
          key_file="${dir}/AuthKey.p8"
          result="${dir}/submission.json"
          log="${notary}/notary-log.json"
          trap 'rm -f "$key_file"' EXIT

          # each line of the key is masked before it is written anywhere.
          while IFS= read -r line; do
            line="${line%$'\r'}"
            if [[ -n "$line" ]]; then
              echo "::add-mask::${line}"
            fi
          done <<<"$MACOS_NOTARY_KEY_P8"
          printf '%s\n' "$MACOS_NOTARY_KEY_P8" >"$key_file"
          chmod 0600 "$key_file"

          submit_status=0
          "$SYSTEM_BIN/xcrun" notarytool submit "$image" \
            --key "$key_file" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json >"$result" || submit_status=$?
          echo "notarytool submit exited ${submit_status} and printed:"
          cat "$result"

          # json_field <field>: the field of the result, or nothing when it is absent
          # or the result is no JSON.
          json_field() {
            "$SYSTEM_BIN/plutil" -extract "$1" raw -o - "$result" 2>/dev/null || true
          }
          submission_id="$(json_field id)"
          status="$(json_field status)"
          id_pattern='^[0-9A-Fa-f-]{36}$'
          if [[ ! "$submission_id" =~ $id_pattern ]]; then
            submission_id=""
          fi

          log_status=0
          if [[ -n "$submission_id" ]]; then
            echo "submission_id=${submission_id}" >>"$GITHUB_OUTPUT"
            "$SYSTEM_BIN/xcrun" notarytool log "$submission_id" \
              --key "$key_file" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" \
              "$log" || log_status=$?
          fi

          [[ -n "$submission_id" ]] || refuse "notarytool printed no submission ID (it exited ${submit_status}), so nothing was accepted"
          [[ "$status" == "Accepted" ]] || refuse "notarization ended with status '${status}', not Accepted (notarytool exited ${submit_status}); the notary log is uploaded"
          if [[ $submit_status -ne 0 ]]; then
            echo "::warning::notarytool exited ${submit_status} although the status is Accepted"
          fi
          if [[ $log_status -ne 0 || ! -s "$log" ]]; then
            refuse "the notary log of submission ${submission_id} could not be fetched (exit ${log_status})"
          fi
          echo "Submission ${submission_id} was accepted."
      - name: Staple And Check The Disk Image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # sign-macos: staple
          set -euo pipefail
          : "${SYSTEM_BIN:=/usr/bin}"

          image="signed/marshal-${VERSION}-macos-arm64.dmg"
          "$SYSTEM_BIN/xcrun" stapler staple "$image"
          "$SYSTEM_BIN/xcrun" stapler validate "$image"
          "$SYSTEM_BIN/codesign" --verify --strict --verbose=2 "$image"
      - name: Hash The Signed Disk Image
        id: hash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # sign-macos: hash
          set -euo pipefail
          : "${SYSTEM_BIN:=/usr/bin}"

          image="signed/marshal-${VERSION}-macos-arm64.dmg"
          line="$("$SYSTEM_BIN/shasum" -a 256 "$image")"
          hash="${line%% *}"
          echo "${hash}  ${image}"
          echo "dmg_sha256=${hash}" >>"$GITHUB_OUTPUT"
      # runs whether the job passed or failed, and is the only step besides the
      # notary log upload that may.
      - name: Delete The Keychain And The Key Files
        if: always()
        run: |
          # sign-macos: cleanup
          set -euo pipefail
          : "${SYSTEM_BIN:=/usr/bin}"

          dir="${RUNNER_TEMP}/marshal-signing"
          keychain="${RUNNER_TEMP}/marshal-signing.keychain-db"
          delete_status=0
          if [[ -e "$keychain" ]]; then
            "$SYSTEM_BIN/security" delete-keychain "$keychain" || delete_status=$?
          fi
          rm -rf "$dir"
          rm -f "$keychain"
          if [[ $delete_status -ne 0 ]]; then
            echo "::warning::security could not delete the keychain (exit ${delete_status}); its file was removed instead"
          fi
          if [[ -e "$keychain" || -e "$dir" ]]; then
            echo "error: the keychain or the signing files are still there" >&2
            exit 1
          fi
          echo "Deleted the keychain, the certificate files and the key file."
      - name: Upload The Notary Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notary-log-macos
          path: ${{ runner.temp }}/marshal-notary
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload The Signed Files
        uses: actions/upload-artifact@v7
        with:
          name: marshal-macos-arm64-signed
          path: signed
          retention-days: 14
          if-no-files-found: error

  # no Environment and no secret. it checks the signed disk image and the app in it
  # with the tools a reader of the release would use, on a runner that holds no
  # signing identity.
  verify-macos:
    name: Verify The Signed Mac Disk Image
    needs: [plan, build, sign-macos]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.version != ''
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      designated_requirement: ${{ steps.test.outputs.designated_requirement }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download The Unsigned Mac App
        uses: actions/download-artifact@v8
        with:
          name: marshal-macos-app
          path: unsigned
      - name: Download The Signed Disk Image
        uses: actions/download-artifact@v8
        with:
          name: marshal-macos-arm64-signed
          path: signed
      - name: Download The Notary Log
        uses: actions/download-artifact@v8
        with:
          name: notary-log-macos
          path: notary
      # the archive must be the one the app job hashed, and the disk image the one
      # sign-macos hashed.
      - name: Check The Files Against Their Jobs' Hashes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          APP_SHA256: ${{ needs.build.outputs.app_sha256 }}
          MACOS_DMG_SHA256: ${{ needs.sign-macos.outputs.macos_dmg_sha256 }}
        run: |
          set -euo pipefail
          # check_hash <file> <hash it must have> <the job that output it>
          check_hash() {
            local line
            line="$(/usr/bin/shasum -a 256 "$1")"
            if [[ "${line%% *}" != "$2" ]]; then
              echo "error: $1 has SHA-256 ${line%% *}, not the ${2} that $3 output" >&2
              exit 1
            fi
          }
          check_hash "unsigned/marshal-${VERSION}-macos-arm64-app.zip" "$APP_SHA256" "the app job"
          check_hash "signed/marshal-${VERSION}-macos-arm64.dmg" "$MACOS_DMG_SHA256" "sign-macos"
      # also checks that the notary log is of the submission sign-macos output, and
      # outputs the app's designated requirement.
      - name: Test The Signed Disk Image
        id: test
        timeout-minutes: 5
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TEAM_ID: ${{ needs.sign-macos.outputs.team_id }}
          SUBMISSION_ID: ${{ needs.sign-macos.outputs.submission_id }}
        run: bash .github/scripts/tests/test-signed-dmg.sh "$VERSION" "unsigned/marshal-${VERSION}-macos-arm64-app.zip" "signed/marshal-${VERSION}-macos-arm64.dmg" notary/notary-log.json "$TEAM_ID" "$SUBMISSION_ID"

  # writes SHA256SUMS over the set that is published: the Windows files as the
  # build made them, each checked against its line in the build's SHA256SUMS, and
  # the disk image as sign-macos signed it, checked against the hash that job
  # handed over.
  assemble-signed:
    name: Assemble The Signed Release Files
    needs: [plan, build, sign-macos, verify-macos]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact: marshal-release-signed
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download The Build's Release Files
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: unsigned
      - name: Download The Signed Disk Image
        uses: actions/download-artifact@v8
        with:
          name: marshal-macos-arm64-signed
          path: signed
      - name: Check The Hashes And Write SHA256SUMS
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MACOS_DMG_SHA256: ${{ needs.sign-macos.outputs.macos_dmg_sha256 }}
        run: |
          set -euo pipefail
          windows="marshal-${VERSION}-windows-x64.exe"
          windows_msi="marshal-${VERSION}-windows-x64.msi"
          macos_dmg="marshal-${VERSION}-macos-arm64.dmg"
          signed_present="$(find signed -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [[ "$signed_present" != "$macos_dmg" ]]; then
            echo "error: the signed files are not exactly ${macos_dmg}:" >&2
            echo "$signed_present" >&2
            exit 1
          fi
          # listed_hash <name>: the hash the build's SHA256SUMS lists for the name,
          # which exactly one line must.
          listed_hash() {
            local lines
            lines="$(awk -v name="$1" '$2 == name { print $1 }' unsigned/SHA256SUMS)"
            if [[ -z "$lines" || "$lines" == *$'\n'* ]]; then
              echo "error: the build's SHA256SUMS does not list $1 exactly once" >&2
              exit 1
            fi
            echo "$lines"
          }
          windows_sha256="$(listed_hash "$windows")"
          windows_msi_sha256="$(listed_hash "$windows_msi")"
          mkdir dist
          cp "unsigned/${windows}" "unsigned/${windows_msi}" "signed/${macos_dmg}" dist
          bash .github/scripts/assemble-release.sh signed "$VERSION" dist "$windows_sha256" "$windows_msi_sha256" "$MACOS_DMG_SHA256"
      - name: Upload The Signed Release Files
        uses: actions/upload-artifact@v7
        with:
          name: marshal-release-signed
          path: dist
          retention-days: 14
          if-no-files-found: error

  attest:
    name: Attest The Build Provenance
    needs: [plan, assemble-signed]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download The Release Files
        uses: actions/download-artifact@v8
        with:
          name: marshal-release-signed
          path: release-files
      # the same check as verify-release.sh, which needs a checkout this job does
      # not have.
      - name: Check The Files And Their Checksums
        id: files
        working-directory: release-files
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          windows="marshal-${VERSION}-windows-x64.exe"
          windows_msi="marshal-${VERSION}-windows-x64.msi"
          macos_dmg="marshal-${VERSION}-macos-arm64.dmg"
          attested="$(printf '%s\n' "$windows" "$windows_msi" "$macos_dmg" | LC_ALL=C sort)"
          expected="$(printf '%s\n' SHA256SUMS "$windows" "$windows_msi" "$macos_dmg" | LC_ALL=C sort)"
          present="$(find . -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [[ "$present" != "$expected" ]]; then
            echo "error: the release files are not exactly ${windows}, ${windows_msi}, ${macos_dmg} and SHA256SUMS:" >&2
            echo "$present" >&2
            exit 1
          fi
          for file in SHA256SUMS "$windows" "$windows_msi" "$macos_dmg"; do
            if [[ ! -f "$file" ]]; then
              echo "error: ${file} is not a regular file" >&2
              exit 1
            fi
          done
          listed="$(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort)"
          if [[ "$listed" != "$attested" ]]; then
            echo "error: SHA256SUMS does not list exactly ${windows}, ${windows_msi} and ${macos_dmg}" >&2
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS
          {
            echo "windows=${windows}"
            echo "windows_msi=${windows_msi}"
            echo "macos_dmg=${macos_dmg}"
          } >> "$GITHUB_OUTPUT"
      - name: Attest The Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-files/${{ steps.files.outputs.windows }}
            release-files/${{ steps.files.outputs.windows_msi }}
            release-files/${{ steps.files.outputs.macos_dmg }}

  release:
    name: Release
    needs: [plan, attest]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install semantic-release
        working-directory: release
        run: npm ci --ignore-scripts
      # release-files/ is where the gate and the asset globs in
      # release/.releaserc.json look.
      - name: Download The Release Files
        uses: actions/download-artifact@v8
        with:
          name: marshal-release-signed
          path: release-files
      - name: Release
        working-directory: release
        env:
          RELEASE_PHASE: release
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no -- semantic-release
