name: Release

# releases Marshal with semantic-release from a manual dispatch on main, and on
# nothing else. docs/operations/cli.md describes the five jobs and
# docs/conventions/security.md the controls and residual risks. it runs on
# GitHub-hosted runners only.
#
# plan works out the version and build makes the unsigned set. assemble-signed is
# where every file of the release meets: it checks the build's set and writes
# SHA256SUMS over it, and attest and release read only what it uploads. no job
# declares an Environment or reads a signing secret until the next signing job,
# M2's or W4's, joins the chain before assemble-signed. the maintainer's dispatch
# is the only decision until then. .github/scripts/check-release-shape.mjs, which
# `mise run check` runs, fails if these jobs drift from that shape;
# docs/operations/cli.md says how W4 and M2 extend them.

on:
  workflow_dispatch:

# one release at a time, never cancelled: a run stopped between pushing the tag
# and publishing would leave a tag without its release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan The Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # the same Node as mise.toml, which Dependabot does not bump here.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install semantic-release
        working-directory: release
        run: npm ci --ignore-scripts
      # verify-release.sh writes the version to this step's outputs; with nothing
      # to release it never runs, so the output stays empty.
      - name: Work Out The Next Version
        id: plan
        working-directory: release
        env:
          RELEASE_PHASE: plan
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no -- semantic-release --dry-run

  build:
    name: Build
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.version != ''
    uses: ./.github/workflows/release-build.yaml
    permissions:
      contents: read
    with:
      version: ${{ needs.plan.outputs.version }}

  # writes SHA256SUMS over the set that is published, the files as the build made
  # them, each checked against its line in the build's SHA256SUMS. a later signing
  # job adds its files here, with the hash its own job hands over.
  assemble-signed:
    name: Assemble The Signed Release Files
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact: marshal-release-signed
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download The Build's Release Files
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: unsigned
      - name: Check The Hashes And Write SHA256SUMS
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          windows="marshal-${VERSION}-windows-x64.exe"
          windows_msi="marshal-${VERSION}-windows-x64.msi"
          # listed_hash <name>: the hash the build's SHA256SUMS lists for the name,
          # which exactly one line must.
          listed_hash() {
            local lines
            lines="$(awk -v name="$1" '$2 == name { print $1 }' unsigned/SHA256SUMS)"
            if [[ -z "$lines" || "$lines" == *$'\n'* ]]; then
              echo "error: the build's SHA256SUMS does not list $1 exactly once" >&2
              exit 1
            fi
            echo "$lines"
          }
          windows_sha256="$(listed_hash "$windows")"
          windows_msi_sha256="$(listed_hash "$windows_msi")"
          mkdir dist
          cp "unsigned/${windows}" "unsigned/${windows_msi}" dist
          bash .github/scripts/assemble-release.sh "$VERSION" dist "$windows_sha256" "$windows_msi_sha256"
      - name: Upload The Signed Release Files
        uses: actions/upload-artifact@v7
        with:
          name: marshal-release-signed
          path: dist
          retention-days: 14
          if-no-files-found: error

  attest:
    name: Attest The Build Provenance
    needs: [plan, assemble-signed]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download The Release Files
        uses: actions/download-artifact@v8
        with:
          name: marshal-release-signed
          path: release-files
      # the same check as verify-release.sh, which needs a checkout this job does
      # not have.
      - name: Check The Files And Their Checksums
        id: files
        working-directory: release-files
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          windows="marshal-${VERSION}-windows-x64.exe"
          windows_msi="marshal-${VERSION}-windows-x64.msi"
          attested="$(printf '%s\n' "$windows" "$windows_msi" | LC_ALL=C sort)"
          expected="$(printf '%s\n' SHA256SUMS "$windows" "$windows_msi" | LC_ALL=C sort)"
          present="$(find . -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [[ "$present" != "$expected" ]]; then
            echo "error: the release files are not exactly ${windows}, ${windows_msi} and SHA256SUMS:" >&2
            echo "$present" >&2
            exit 1
          fi
          for file in SHA256SUMS "$windows" "$windows_msi"; do
            if [[ ! -f "$file" ]]; then
              echo "error: ${file} is not a regular file" >&2
              exit 1
            fi
          done
          listed="$(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort)"
          if [[ "$listed" != "$attested" ]]; then
            echo "error: SHA256SUMS does not list exactly ${windows} and ${windows_msi}" >&2
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS
          {
            echo "windows=${windows}"
            echo "windows_msi=${windows_msi}"
          } >> "$GITHUB_OUTPUT"
      - name: Attest The Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-files/${{ steps.files.outputs.windows }}
            release-files/${{ steps.files.outputs.windows_msi }}

  release:
    name: Release
    needs: [plan, attest]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install semantic-release
        working-directory: release
        run: npm ci --ignore-scripts
      # release-files/ is where the gate and the asset globs in
      # release/.releaserc.json look.
      - name: Download The Release Files
        uses: actions/download-artifact@v8
        with:
          name: marshal-release-signed
          path: release-files
      - name: Release
        working-directory: release
        env:
          RELEASE_PHASE: release
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no -- semantic-release
