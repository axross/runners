name: Release Build

# builds the CLI's release binaries for Windows x64 and macOS arm64 at the
# version its caller passes, packs each into an unsigned installer (an MSI and a
# pkg), tests the installers, and puts the four files and SHA256SUMS in one
# artifact. it also builds the unsigned Mac app and a disk image of it, kept apart
# in marshal-macos-app for release.yaml's signing job. merge-checks.yaml calls it as
# a dry run and release.yaml for a release; it has no publish or attest step. see
# docs/conventions/security.md, which also says why only the callers declare
# `concurrency`.

on:
  workflow_call:
    inputs:
      version:
        description: The version to build, X.Y.Z or X.Y.Z-<prerelease>
        required: true
        type: string
    outputs:
      artifact:
        description: The artifact holding the two binaries, their two installers, and SHA256SUMS
        value: ${{ jobs.assemble.outputs.artifact }}
      app_sha256:
        description: The SHA-256 of the unsigned Mac app's ditto archive in marshal-macos-app
        value: ${{ jobs.app-macos.outputs.app_sha256 }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            host: x86_64-pc-windows-msvc
            suffix: .exe
            installer-suffix: .msi
            sha256-output: windows_x64_sha256
            installer-sha256-output: windows_x64_msi_sha256
          - os: macos-latest
            target: macos-arm64
            host: aarch64-apple-darwin
            suffix: ""
            installer-suffix: .pkg
            sha256-output: macos_arm64_sha256
            installer-sha256-output: macos_arm64_pkg_sha256
    # a matrix leg sets only its own hash output, so the two legs do not overwrite
    # each other's.
    outputs:
      windows_x64_sha256: ${{ steps.hash.outputs.windows_x64_sha256 }}
      windows_x64_msi_sha256: ${{ steps.hash.outputs.windows_x64_msi_sha256 }}
      macos_arm64_sha256: ${{ steps.hash.outputs.macos_arm64_sha256 }}
      macos_arm64_pkg_sha256: ${{ steps.hash.outputs.macos_arm64_pkg_sha256 }}
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Rust Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # each target builds natively, so a change of runner image fails here
      # instead of shipping the wrong architecture.
      - name: Check The Compiler's Host Target
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          host="$(rustc -vV | tr -d '\r' | sed -n 's/^host: //p')"
          if [[ "$host" != "$EXPECTED_HOST" ]]; then
            echo "error: rustc's host target is '${host}', not ${EXPECTED_HOST}; this runner image builds the wrong architecture" >&2
            exit 1
          fi
          echo "rustc's host target is ${host}."
      # before anything compiles, so `--locked` fails if the two files disagree
      # and the binary's --version is the input's.
      - name: Write The Release Version
        env:
          VERSION: ${{ inputs.version }}
        run: bash ../.github/scripts/set-release-version.sh "$VERSION"
      # the installers carry the release's X.Y.Z, or 0.0.0 for a dry run. a version
      # beyond the MSI limits, or in another prerelease form, fails here before
      # anything compiles. the substitution is assigned first so its failure fails
      # the step.
      - name: Map The Installer Version
        id: installer-version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          installer_version="$(bash ../.github/scripts/installer-version.sh "$VERSION")"
          echo "version=${installer_version}" >> "$GITHUB_OUTPUT"
          echo "The installers carry version ${installer_version}."
      # MARSHAL_EXPECT_RELEASE makes each test fail if it was built in the wrong
      # profile.
      - name: Test That A Release Build Ignores The Debug-Only Overrides
        env:
          MARSHAL_EXPECT_RELEASE: "1"
        run: cargo test --locked --release --test base_address --test instance_roots --test build_definition --test release_overrides --test agent_overrides
      # `cargo test` above also builds the fake-docker, fake-tart, fake-softnet,
      # fake-macos and instance-helper helpers into target/release; only marshal is
      # copied out.
      - name: Build The Release Binary
        run: cargo build --locked --release --bin marshal
      - name: Check The Binary's Version
        env:
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          printed="$("target/release/marshal${SUFFIX}" --version | tr -d '\r')"
          if [[ "$printed" != "marshal ${VERSION}" ]]; then
            echo "error: the binary's --version printed '${printed}', not 'marshal ${VERSION}'" >&2
            exit 1
          fi
          echo "The binary prints '${printed}'."
      - name: Name The Binary For The Release
        id: asset
        env:
          INSTALLER_SUFFIX: ${{ matrix.installer-suffix }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          asset="marshal-${VERSION}-${TARGET}${SUFFIX}"
          mkdir ../dist
          cp "target/release/marshal${SUFFIX}" "../dist/${asset}"
          echo "name=${asset}" >> "$GITHUB_OUTPUT"
          echo "installer=marshal-${VERSION}-${TARGET}${INSTALLER_SUFFIX}" >> "$GITHUB_OUTPUT"
      # the binary links the C runtime statically (cli/.cargo/config.toml), so a host
      # without the Visual C++ redistributable runs it. vswhere finds dumpbin in the
      # MSVC tools. the check fails unless dumpbin listed KERNEL32.dll, so a run
      # that read nothing cannot pass.
      - name: Check That The Windows Binary Imports No vcruntime DLL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe') | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $dumpbin) { throw 'vswhere found no dumpbin.exe for x64.' }
          $report = @(& $dumpbin /nologo /dependents (Join-Path '..\dist' $env:ASSET))
          if ($LASTEXITCODE -ne 0) { throw "dumpbin exited $LASTEXITCODE." }
          $report | Write-Host
          if (-not ($report -match 'Image has the following dependencies')) { throw 'dumpbin printed no dependency list.' }
          if (-not ($report -match '^\s*KERNEL32\.dll\s*$')) { throw 'dumpbin listed no KERNEL32.dll, so its output cannot be trusted.' }
          $runtime = @($report -match 'vcruntime')
          if ($runtime.Count -gt 0) { throw "The binary imports a vcruntime DLL: $($runtime -join ', ')" }
          Write-Host 'The binary imports no vcruntime DLL.'
      # WiX is the one tool fetched at build time. the script refuses it unless
      # its SHA-256 matches the pin and installs it from that package alone; see
      # docs/conventions/security.md.
      - name: Fetch WiX
        if: runner.os == 'Windows'
        env:
          WIX_DIRECTORY: ${{ runner.temp }}\wix
        run: bash ../.github/scripts/fetch-wix.sh "$WIX_DIRECTORY"
      - name: Build The MSI
        if: runner.os == 'Windows'
        shell: powershell
        env:
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_VERSION: ${{ steps.installer-version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
          WIX_DIRECTORY: ${{ runner.temp }}\wix
        run: |
          $dist = (Resolve-Path ..\dist).Path
          ..\.github\scripts\build-msi.ps1 -Binary (Join-Path $dist $env:ASSET) -Version $env:INSTALLER_VERSION -Output (Join-Path $dist $env:INSTALLER) -WixDirectory $env:WIX_DIRECTORY
      - name: Build The Package
        if: runner.os == 'macOS'
        env:
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_VERSION: ${{ steps.installer-version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
        run: bash ../.github/scripts/build-pkg.sh "../dist/${ASSET}" "$INSTALLER_VERSION" "../dist/${INSTALLER}"
      # the tests install and remove packages on the runner with the real tools, and
      # build their own throwaway installers at fixed test versions; only the files
      # in dist are uploaded. each measured outcome is a MEASURED line in the log.
      - name: Test The MSI
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: powershell
        env:
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_VERSION: ${{ steps.installer-version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
          VERSION: ${{ inputs.version }}
          WIX_DIRECTORY: ${{ runner.temp }}\wix
        run: |
          $dist = (Resolve-Path ..\dist).Path
          ..\.github\scripts\tests\test-msi-installer.ps1 -Binary (Join-Path $dist $env:ASSET) -ReleaseMsi (Join-Path $dist $env:INSTALLER) -ReleaseVersion $env:VERSION -InstallerVersion $env:INSTALLER_VERSION -WixDirectory $env:WIX_DIRECTORY -LogDirectory (Join-Path $env:RUNNER_TEMP 'installer-logs')
      - name: Test The Package
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_VERSION: ${{ steps.installer-version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: bash ../.github/scripts/tests/test-pkg-installer.sh "${PWD}/../dist/${ASSET}" "${PWD}/../dist/${INSTALLER}" "$VERSION" "$INSTALLER_VERSION" "${RUNNER_TEMP}/installer-logs"
      # holds no secret. release.yaml's sign-macos and verify-macos call these tools
      # by absolute path, and a tool that moves on a new runner image should fail a
      # pull request here instead of a release. the lists must name every tool those
      # jobs and test-signed-pkg.sh call; check-release-shape.mjs compares them.
      # base64 and shasum are run, since their flags are what the jobs rely on.
      - name: Check The Signing Tools
        if: runner.os == 'macOS'
        run: |
          bin_tools="security codesign pkgbuild openssl plutil shasum xcrun lsbom sudo"
          sbin_tools="pkgutil spctl installer"
          found=""
          missing=""
          for tool in $bin_tools; do
            if [[ -x "/usr/bin/${tool}" ]]; then
              found="${found} ${tool}=/usr/bin/${tool}"
            else
              missing="${missing} /usr/bin/${tool}"
            fi
          done
          for tool in $sbin_tools; do
            if [[ -x "/usr/sbin/${tool}" ]]; then
              found="${found} ${tool}=/usr/sbin/${tool}"
            else
              missing="${missing} /usr/sbin/${tool}"
            fi
          done
          for tool in notarytool stapler; do
            path="$(/usr/bin/xcrun --find "$tool" 2>/dev/null)" || path=""
            if [[ -n "$path" ]]; then
              found="${found} ${tool}=${path}"
            else
              missing="${missing} xcrun:${tool}"
            fi
          done
          base64_path="$(command -v base64)" || base64_path=""
          if [[ -n "$base64_path" && "$(printf 'dGVzdA==' | base64 --decode)" == "test" ]]; then
            found="${found} base64=${base64_path}"
          else
            missing="${missing} base64:--decode"
          fi
          if [[ "$(/usr/bin/shasum -a 256 </dev/null)" != e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855* ]]; then
            missing="${missing} shasum:-a-256"
          fi
          echo "MEASURED: signing tools:${found}"
          if [[ -n "$missing" ]]; then
            echo "error: the signing jobs call tools that are missing or do not behave as they rely on:${missing}" >&2
            exit 1
          fi
      - name: Upload The Installer Test Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-test-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/installer-logs
          retention-days: 14
          overwrite: true
      # sha256sum where the runner has it, as Git Bash on Windows does, and shasum
      # on macOS, which may lack sha256sum.
      - name: Hash The Binary And The Installer
        id: hash
        working-directory: dist
        env:
          ASSET: ${{ steps.asset.outputs.name }}
          HASH_OUTPUT: ${{ matrix.sha256-output }}
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_HASH_OUTPUT: ${{ matrix.installer-sha256-output }}
        run: |
          hash_file() {
            local line hash
            if command -v sha256sum >/dev/null 2>&1; then
              line="$(sha256sum "$1")"
            else
              line="$(shasum -a 256 "$1")"
            fi
            hash="${line%% *}"
            if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
              echo "error: '${line}' does not start with a SHA-256" >&2
              exit 1
            fi
            echo "${2}=${hash}" >> "$GITHUB_OUTPUT"
            echo "${hash}  ${1}"
          }
          hash_file "$ASSET" "$HASH_OUTPUT"
          hash_file "$INSTALLER" "$INSTALLER_HASH_OUTPUT"
      - name: Upload The Binary And The Installer
        uses: actions/upload-artifact@v7
        with:
          name: marshal-${{ matrix.target }}
          path: |
            dist/${{ steps.asset.outputs.name }}
            dist/${{ steps.asset.outputs.installer }}
          if-no-files-found: error

  # the Mac app, built unsigned at the installer version, since a bundle version
  # takes only X.Y.Z. `tauri-cli` is installed from source at the pin with --locked,
  # as in merge-checks.yaml's app jobs, and nothing else is downloaded. the app goes
  # in a ditto archive, which keeps file modes an artifact would drop, and its hash
  # is the workflow's app_sha256, which release.yaml's signing job checks. the disk
  # image is the dry run's; the signing job builds its own from the archive with the
  # same hdiutil arguments. marshal-macos-app stays outside marshal-release, so the
  # unsigned set holds no Mac file. see docs/operations/app.md.
  app-macos:
    name: Build The Mac App
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      app_sha256: ${{ steps.hash.outputs.app_sha256 }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Rust Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # the release's X.Y.Z, or 0.0.0 for a dry run, since 0.0.0-dryrun.<n> is not a
      # valid bundle version. the file names keep the full version.
      - name: Map The Bundle Version
        id: bundle-version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bundle_version="$(bash ../.github/scripts/installer-version.sh "$VERSION")"
          echo "version=${bundle_version}" >> "$GITHUB_OUTPUT"
          echo "The app carries bundle version ${bundle_version}."
      # a debug build lets a test run Marshal from anywhere; this builds the location
      # rule's tests in the release profile with the variable set, so the test that a
      # release build ignores it fails if it does not.
      - name: Test That A Release Build Ignores The Location Variable
        env:
          MARSHAL_EXPECT_RELEASE: "1"
          MARSHAL_TEST_ANY_LOCATION: "1"
        run: cargo test --locked --release --package marshal-session --lib location
      # one step, so the tool's install and the build share one bound. --no-sign
      # keeps Tauri's own signer out: it passes no secure timestamp, which
      # notarization needs, and the job holds no identity anyway.
      - name: Install tauri-cli At The Pin And Build The Mac App
        timeout-minutes: 30
        env:
          BUNDLE_VERSION: ${{ steps.bundle-version.outputs.version }}
        run: |
          tauri_cli_version="$(bash ../.github/scripts/tauri-cli-version.sh)"
          cargo install tauri-cli --version "=${tauri_cli_version}" --locked --root "${RUNNER_TEMP}/tauri-cli"
          export PATH="${RUNNER_TEMP}/tauri-cli/bin:${PATH}"
          cd crates/app
          cargo tauri build --bundles app --no-sign --config "{\"version\":\"${BUNDLE_VERSION}\"}"
      - name: Fail If The Build Changed A Tracked File
        run: |
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard --full-name -- :/)"
          if [[ -n "$untracked" ]]; then
            echo "error: the build left files that are neither tracked nor ignored:" >&2
            echo "$untracked" >&2
            exit 1
          fi
      - name: Check The Bundle's Layout
        env:
          BUNDLE_VERSION: ${{ steps.bundle-version.outputs.version }}
        run: |
          app=target/release/bundle/macos/Marshal.app
          plist="${app}/Contents/Info.plist"
          [[ "$(ls "${app}/Contents/MacOS")" == marshal-app ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" == app.axross.marshal ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$BUNDLE_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$BUNDLE_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" == 26.0 ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" == true ]]
          test -f "${app}/Contents/Resources/icon.icns"
          test -f "${app}/Contents/Resources/THIRD-PARTY-NOTICES.txt"
          if /usr/bin/codesign --verify "$app" 2>/dev/null; then
            echo "error: the app carries a signature; the release build must leave it unsigned" >&2
            exit 1
          fi
      - name: Archive The App
        id: hash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir ../dist
          archive="../dist/marshal-${VERSION}-macos-arm64-app.zip"
          /usr/bin/ditto -c -k --norsrc --noextattr --keepParent target/release/bundle/macos/Marshal.app "$archive"
          line="$(/usr/bin/shasum -a 256 "$archive")"
          hash="${line%% *}"
          if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
            echo "error: '${line}' does not start with a SHA-256" >&2
            exit 1
          fi
          echo "app_sha256=${hash}" >> "$GITHUB_OUTPUT"
          echo "${hash}  ${archive##*/}"
      # hdiutil create has failed on hosted runners with "Resource busy", so it gets
      # three attempts 10 seconds apart. the arguments are the ones the signing job
      # uses.
      - name: Make The Disk Image
        timeout-minutes: 10
        env:
          VERSION: ${{ inputs.version }}
        run: |
          stage="${RUNNER_TEMP}/marshal-dmg"
          image="../dist/marshal-${VERSION}-macos-arm64.dmg"
          mkdir -p "$stage"
          /usr/bin/ditto target/release/bundle/macos/Marshal.app "${stage}/Marshal.app"
          /bin/ln -s /Applications "${stage}/Applications"
          attempt=1
          until /usr/bin/hdiutil create -volname Marshal -srcfolder "$stage" -format UDZO -ov "$image"; do
            if [[ "$attempt" -ge 3 ]]; then
              echo "error: hdiutil create failed ${attempt} times" >&2
              exit 1
            fi
            echo "hdiutil create failed on attempt ${attempt}; trying again in 10 seconds"
            attempt=$((attempt + 1))
            sleep 10
          done
      - name: Check The Disk Image's Layout
        env:
          VERSION: ${{ inputs.version }}
        run: |
          image="../dist/marshal-${VERSION}-macos-arm64.dmg"
          mount="${RUNNER_TEMP}/marshal-dmg-mount"
          mkdir -p "$mount"
          /usr/bin/hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "$image" >/dev/null
          trap '/usr/bin/hdiutil detach -quiet "$mount" || /usr/bin/hdiutil detach -force -quiet "$mount"' EXIT
          entries=""
          shopt -s dotglob nullglob
          for entry in "$mount"/*; do
            case "${entry##*/}" in
              .DS_Store | .fseventsd | .Trashes) ;;
              *) entries="${entries} ${entry##*/}" ;;
            esac
          done
          if [[ "$entries" != " Applications Marshal.app" ]]; then
            echo "error: the disk image holds '${entries}', not Applications and Marshal.app" >&2
            exit 1
          fi
          [[ -L "${mount}/Applications" && "$(readlink "${mount}/Applications")" == /Applications ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${mount}/Marshal.app/Contents/Info.plist")" == app.axross.marshal ]]
          [[ "$(/usr/sbin/diskutil info "$mount" | sed -n 's/^ *Volume Name: *//p')" == Marshal ]]
          echo "The disk image holds Marshal.app and the Applications link, on volume Marshal."
      - name: Upload The App Archive And The Disk Image
        uses: actions/upload-artifact@v7
        with:
          name: marshal-macos-app
          path: |
            dist/marshal-${{ inputs.version }}-macos-arm64-app.zip
            dist/marshal-${{ inputs.version }}-macos-arm64.dmg
          if-no-files-found: error

  # the hashes are handed over as job outputs, apart from the artifacts, so a file
  # that changed between the build and here fails the check. assemble-release.sh
  # compares them and writes SHA256SUMS, as release.yaml's assemble-signed job
  # does for the signed set.
  assemble:
    name: Assemble The Release Files
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: marshal-release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download The Windows Files
        uses: actions/download-artifact@v8
        with:
          name: marshal-windows-x64
          path: dist
      - name: Download The macOS Files
        uses: actions/download-artifact@v8
        with:
          name: marshal-macos-arm64
          path: dist
      - name: Check The Hashes And Write SHA256SUMS
        env:
          VERSION: ${{ inputs.version }}
          WINDOWS_SHA256: ${{ needs.build.outputs.windows_x64_sha256 }}
          WINDOWS_MSI_SHA256: ${{ needs.build.outputs.windows_x64_msi_sha256 }}
          MACOS_SHA256: ${{ needs.build.outputs.macos_arm64_sha256 }}
          MACOS_PKG_SHA256: ${{ needs.build.outputs.macos_arm64_pkg_sha256 }}
        run: bash .github/scripts/assemble-release.sh "$VERSION" dist "$WINDOWS_SHA256" "$WINDOWS_MSI_SHA256" "$MACOS_SHA256" "$MACOS_PKG_SHA256"
      # dist holds exactly the four files and SHA256SUMS, which the script checked.
      - name: Upload The Release Files
        uses: actions/upload-artifact@v7
        with:
          name: marshal-release
          path: dist
          if-no-files-found: error
