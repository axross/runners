name: Release Build

# builds the Windows app at the version its caller passes, packs it into an
# unsigned per-user MSI, tests the MSI, and puts the app executable, the MSI and
# SHA256SUMS in one artifact. merge-checks.yaml calls it as a dry run and
# release.yaml for a release; it has no publish or attest step. see
# docs/conventions/security.md, which also says why only the callers declare
# `concurrency`.

on:
  workflow_call:
    inputs:
      version:
        description: The version to build, X.Y.Z or X.Y.Z-<prerelease>
        required: true
        type: string
    outputs:
      artifact:
        description: The artifact holding the app executable, its MSI, and SHA256SUMS
        value: ${{ jobs.assemble.outputs.artifact }}

permissions:
  contents: read

jobs:
  # no cache action: a cache would be a trust boundary for a job that builds the
  # release, and tauri-cli is installed from source at its pin on every run.
  build:
    name: Build windows-x64
    runs-on: windows-latest
    # twice the leg's 22 min 56 s in its first successful dry run (#117), rounded
    # up to whole 5 minutes; see docs/operations/cli.md.
    timeout-minutes: 50
    outputs:
      windows_x64_sha256: ${{ steps.hash.outputs.windows_x64_sha256 }}
      windows_x64_msi_sha256: ${{ steps.hash.outputs.windows_x64_msi_sha256 }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Rust Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # the build is native, so a change of runner image fails here instead of
      # shipping the wrong architecture.
      - name: Check The Compiler's Host Target
        run: |
          host="$(rustc -vV | tr -d '\r' | sed -n 's/^host: //p')"
          if [[ "$host" != "x86_64-pc-windows-msvc" ]]; then
            echo "error: rustc's host target is '${host}', not x86_64-pc-windows-msvc; this runner image builds the wrong architecture" >&2
            exit 1
          fi
          echo "rustc's host target is ${host}."
      # before anything compiles, so `--locked` fails if a manifest and its lockfile
      # disagree, and the app's product version is the input's.
      - name: Write The Release Version
        env:
          VERSION: ${{ inputs.version }}
        run: bash ../.github/scripts/set-release-version.sh "$VERSION"
      # the MSI carries the release's X.Y.Z, or 0.0.0 for a dry run. a version
      # beyond the MSI limits, or in another prerelease form, fails here before
      # anything compiles. the substitution is assigned first so its failure fails
      # the step.
      - name: Map The Installer Version
        id: installer-version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          installer_version="$(bash ../.github/scripts/installer-version.sh "$VERSION")"
          echo "version=${installer_version}" >> "$GITHUB_OUTPUT"
          echo "The installer carries version ${installer_version}."
      # MARSHAL_EXPECT_RELEASE makes each test fail if it was built in the wrong
      # profile.
      - name: Test That A Release Build Of The CLI Ignores The Debug-Only Overrides
        working-directory: cli
        env:
          MARSHAL_EXPECT_RELEASE: "1"
        run: cargo test --locked --release --test base_address --test instance_roots --test build_definition --test release_overrides --test agent_overrides
      # the three variables are set so that the test that a release build ignores
      # them fails if it does not, as in merge-checks.yaml's app-modes job.
      - name: Test That A Release Build Of The App Ignores The Debug-Only Variables
        env:
          MARSHAL_EXPECT_RELEASE: "1"
          MARSHAL_TEST_ROOT: C:\nonexistent\marshal-test-root
          MARSHAL_TEST_DOCKER: C:\nonexistent\docker.exe
          MARSHAL_TEST_GITHUB_API: http://127.0.0.1:9
        run: cargo test --locked --release --package marshal-modes
      # the pin is read from app/tauri-cli.version, the one place it is set, as
      # merge-checks.yaml's app job does; Cargo checks the crate archive and its
      # locked dependencies against the crates.io index checksums.
      - name: Install tauri-cli At The Pin
        run: |
          version="$(bash ../.github/scripts/tauri-cli-version.sh)"
          cargo install tauri-cli --version "=${version}" --locked --root "${RUNNER_TEMP}/tauri-cli"
          echo "${RUNNER_TEMP}/tauri-cli/bin" >> "$GITHUB_PATH"
      # tauri build runs cargo without --locked, so the stamped lockfile is kept
      # aside and compared afterwards: a build that resolved anything anew fails.
      - name: Build The App
        working-directory: app/crates/app
        run: |
          cp ../../Cargo.lock "${RUNNER_TEMP}/Cargo.lock.stamped"
          cargo tauri build --no-bundle
          if ! cmp -s ../../Cargo.lock "${RUNNER_TEMP}/Cargo.lock.stamped"; then
            echo "error: the build changed app/Cargo.lock" >&2
            exit 1
          fi
      # the second run gives a version that differs from the stamped one, and must
      # fail, so a check that cannot fail does not pass.
      - name: Check The App's Product Version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'target\release\marshal-app.exe'
          ..\.github\scripts\check-product-version.ps1 -Executable $app -Version $env:VERSION
          $refused = $false
          try { ..\.github\scripts\check-product-version.ps1 -Executable $app -Version "$env:VERSION.mismatch" } catch { $refused = $true; Write-Host "As expected, a differing version is refused: $_" }
          if (-not $refused) { throw 'The product version check passed a version that differs from the stamped one.' }
      - name: Name The Files For The Release
        id: asset
        env:
          VERSION: ${{ inputs.version }}
        run: |
          asset="marshal-${VERSION}-windows-x64.exe"
          mkdir ../dist
          cp target/release/marshal-app.exe "../dist/${asset}"
          echo "name=${asset}" >> "$GITHUB_OUTPUT"
          echo "installer=marshal-${VERSION}-windows-x64.msi" >> "$GITHUB_OUTPUT"
      # Tauri links the C runtime statically, so a host without the Visual C++
      # redistributable runs the app. vswhere finds dumpbin in the MSVC tools. the
      # check fails unless dumpbin listed KERNEL32.dll, so a run that read nothing
      # cannot pass.
      - name: Check That The App Imports No vcruntime DLL
        shell: pwsh
        env:
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe') | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $dumpbin) { throw 'vswhere found no dumpbin.exe for x64.' }
          $report = @(& $dumpbin /nologo /dependents (Join-Path '..\dist' $env:ASSET))
          if ($LASTEXITCODE -ne 0) { throw "dumpbin exited $LASTEXITCODE." }
          $report | Write-Host
          if (-not ($report -match 'Image has the following dependencies')) { throw 'dumpbin printed no dependency list.' }
          if (-not ($report -match '^\s*KERNEL32\.dll\s*$')) { throw 'dumpbin listed no KERNEL32.dll, so its output cannot be trusted.' }
          $runtime = @($report -match 'vcruntime')
          if ($runtime.Count -gt 0) { throw "The app imports a vcruntime DLL: $($runtime -join ', ')" }
          Write-Host 'The app imports no vcruntime DLL.'
      # WiX is the one tool fetched as a package at build time. the script refuses
      # it unless its SHA-256 matches the pin and installs it from that package
      # alone; see docs/conventions/security.md.
      - name: Fetch WiX
        env:
          WIX_DIRECTORY: ${{ runner.temp }}\wix
        run: bash ../.github/scripts/fetch-wix.sh "$WIX_DIRECTORY"
      - name: Build The MSI
        shell: powershell
        env:
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_VERSION: ${{ steps.installer-version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
          WIX_DIRECTORY: ${{ runner.temp }}\wix
        run: |
          $dist = (Resolve-Path ..\dist).Path
          ..\.github\scripts\build-msi.ps1 -App (Join-Path $dist $env:ASSET) -Notices (Resolve-Path notices\THIRD-PARTY-NOTICES-windows.txt).Path -Version $env:INSTALLER_VERSION -Output (Join-Path $dist $env:INSTALLER) -WixDirectory $env:WIX_DIRECTORY
      # the test installs and removes packages on the runner with the real msiexec,
      # and builds its own throwaway MSIs at fixed test versions; only the files in
      # dist are uploaded. each measured outcome is a MEASURED line in the log.
      - name: Test The MSI
        timeout-minutes: 15
        shell: powershell
        env:
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_VERSION: ${{ steps.installer-version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
          WIX_DIRECTORY: ${{ runner.temp }}\wix
        run: |
          $dist = (Resolve-Path ..\dist).Path
          ..\.github\scripts\tests\test-msi-installer.ps1 -App (Join-Path $dist $env:ASSET) -Notices (Resolve-Path notices\THIRD-PARTY-NOTICES-windows.txt).Path -ReleaseMsi (Join-Path $dist $env:INSTALLER) -InstallerVersion $env:INSTALLER_VERSION -WixDirectory $env:WIX_DIRECTORY -LogDirectory (Join-Path $env:RUNNER_TEMP 'installer-logs')
      - name: Upload The Installer Test Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-test-logs-windows-x64
          path: ${{ runner.temp }}/installer-logs
          retention-days: 14
          overwrite: true
      - name: Hash The App And The Installer
        id: hash
        working-directory: dist
        env:
          ASSET: ${{ steps.asset.outputs.name }}
          INSTALLER: ${{ steps.asset.outputs.installer }}
        run: |
          hash_file() {
            local line hash
            line="$(sha256sum "$1")"
            hash="${line%% *}"
            if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
              echo "error: '${line}' does not start with a SHA-256" >&2
              exit 1
            fi
            echo "${2}=${hash}" >> "$GITHUB_OUTPUT"
            echo "${hash}  ${1}"
          }
          hash_file "$ASSET" windows_x64_sha256
          hash_file "$INSTALLER" windows_x64_msi_sha256
      - name: Upload The App And The Installer
        uses: actions/upload-artifact@v7
        with:
          name: marshal-windows-x64
          path: |
            dist/${{ steps.asset.outputs.name }}
            dist/${{ steps.asset.outputs.installer }}
          if-no-files-found: error

  # the hashes are handed over as job outputs, apart from the artifact, so a file
  # that changed between the build and here fails the check. assemble-release.sh
  # compares them and writes SHA256SUMS, as release.yaml's assemble-signed job
  # does for the signed set.
  assemble:
    name: Assemble The Release Files
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: marshal-release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download The Windows Files
        uses: actions/download-artifact@v8
        with:
          name: marshal-windows-x64
          path: dist
      - name: Check The Hashes And Write SHA256SUMS
        env:
          VERSION: ${{ inputs.version }}
          WINDOWS_SHA256: ${{ needs.build.outputs.windows_x64_sha256 }}
          WINDOWS_MSI_SHA256: ${{ needs.build.outputs.windows_x64_msi_sha256 }}
        run: bash .github/scripts/assemble-release.sh unsigned "$VERSION" dist "$WINDOWS_SHA256" "$WINDOWS_MSI_SHA256"
      # dist holds exactly the two files and SHA256SUMS, which the script checked.
      - name: Upload The Release Files
        uses: actions/upload-artifact@v7
        with:
          name: marshal-release
          path: dist
          if-no-files-found: error
