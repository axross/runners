name: Claude Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    name: Review
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       (github.event.comment.user.login == 'claude[bot]' &&
        !contains(github.event.comment.body, '## ')))
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The action posts to the pull request with a Claude GitHub App token it
    # obtains by exchanging this job's OIDC token, not with the job token, so the
    # job needs no write scope. docs/conventions/security.md records the check.
    permissions:
      contents: read # actions/checkout reads the default branch
      id-token: write # the OIDC token the action exchanges for the app token
    env:
      # Best-effort scrub of secrets from the environments of the shell commands
      # the model runs: CLAUDE_CODE_OAUTH_TOKEN and the ACTIONS_* runtime tokens
      # are removed. GH_TOKEN and GITHUB_TOKEN, which hold the Claude GitHub App
      # token, stay visible because gh needs them. The action forwards this
      # variable to its run step. It reduces, and does not remove, what a prompt
      # injection through pull request content can reach.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      # Required, not optional. With the scrub set, Claude Code refuses to start
      # without bubblewrap, and every Bash call fails without socat. The action
      # installs these packages best-effort, and only when allowed_non_write_users
      # is set; this step fails the job instead, because the review cannot start
      # without them.
      - name: Install Subprocess Isolation Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The action configures its own git authentication with the app token.
          persist-credentials: false

      - name: Claude Review
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          # Unpinned by necessity; see docs/conventions/security.md.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }} --comment"
          claude_args: >-
            --append-system-prompt "Read REVIEW.md at the repository root and follow it as the highest-priority, review-only instructions for this review. Review this pull request even if it is a draft, already has comments or reviews from Claude, or looks trivial or automated — each request is a fresh review round, so do not stop at any of the command's step-1 checks except a closed pull request. Do the ENTIRE review within this single turn: run every check and review pass yourself, synchronously and in order. Do NOT kick off background or parallel work and then end your turn to wait for it — this is a one-shot job that terminates the instant your turn ends, so anything you defer is lost and no review is posted. You MUST post your findings (inline comments plus a summary via `gh pr comment`) before your turn ends. This reviewer is advisory and does not gate merges."
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "WebFetch,WebSearch,Task,Agent"
            --max-turns 200
