name: CLI Recovery Build

on:
  workflow_call:
    inputs:
      version:
        description: The CLI version to build, X.Y.Z or 0.0.0-dryrun.<n>
        required: true
        type: string
    outputs:
      artifact:
        description: Unsigned historical CLI binaries, MSI, pkg, and SHA256SUMS
        value: ${{ jobs.assemble.outputs.artifact }}

permissions:
  contents: read

jobs:
  dependencies:
    name: Check Historical CLI Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: historical/cli
    steps:
      - name: Checkout The Workflow Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout The Complete Historical Source
        uses: actions/checkout@v7
        with:
          repository: axross/runners
          ref: dc8e1ebcc0722997206487f3dcca2ae7e519cf02
          path: historical
          persist-credentials: false
      - name: Check And Stamp The Historical Input
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          echo "Current workflow/tag commit: ${WORKFLOW_COMMIT}"
          bash .github/scripts/cli-recovery/prepare-source.sh prepare historical "$VERSION"
      - name: Install Pinned Rust Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install The Historical Dependency Checker Without A Cache
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.9.17
          sha256: 63049bc35fb9065e8dc35ac8b25fdae53e9bd6f1885a843aedeba398e046a1ee
          working_directory: historical
          install_args: cargo-deny
          cache: false
      - name: Check The Historical Licence Source And Duplicate Policy
        run: |
          cargo fetch --locked
          mise exec cargo-deny -- cargo deny --locked check bans licenses sources
      - name: Recheck Historical Input After Dependency Checks
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/cli-recovery/prepare-source.sh verify historical "$VERSION"

  build:
    name: Build Historical CLI ${{ matrix.target }}
    needs: dependencies
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            host: x86_64-pc-windows-msvc
            suffix: .exe
            installer-suffix: .msi
            sha256-output: windows_x64_sha256
            installer-sha256-output: windows_x64_msi_sha256
          - os: macos-latest
            target: macos-arm64
            host: aarch64-apple-darwin
            suffix: ""
            installer-suffix: .pkg
            sha256-output: macos_arm64_sha256
            installer-sha256-output: macos_arm64_pkg_sha256
    outputs:
      windows_x64_sha256: ${{ steps.hash.outputs.windows_x64_sha256 }}
      windows_x64_msi_sha256: ${{ steps.hash.outputs.windows_x64_msi_sha256 }}
      macos_arm64_sha256: ${{ steps.hash.outputs.macos_arm64_sha256 }}
      macos_arm64_pkg_sha256: ${{ steps.hash.outputs.macos_arm64_pkg_sha256 }}
    defaults:
      run:
        shell: bash
        working-directory: historical/cli
    steps:
      - name: Checkout The Workflow Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout The Complete Historical Source
        uses: actions/checkout@v7
        with:
          repository: axross/runners
          ref: dc8e1ebcc0722997206487f3dcca2ae7e519cf02
          path: historical
          persist-credentials: false
      - name: Check And Stamp The Historical Input
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          echo "Current workflow/tag commit: ${WORKFLOW_COMMIT}"
          bash .github/scripts/cli-recovery/prepare-source.sh prepare historical "$VERSION"
      - name: Install Pinned Rust Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Keep Build Outputs Outside The Historical Input
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cli-recovery-target" >> "$GITHUB_ENV"
      - name: Check The Compiler's Host Target
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          host="$(rustc -vV | tr -d '\r' | sed -n 's/^host: //p')"
          if [[ "$host" != "$EXPECTED_HOST" ]]; then
            echo "error: rustc's host target is '${host}', not ${EXPECTED_HOST}" >&2
            exit 1
          fi
          echo "rustc's host target is ${host}."
      - name: Map The Installer Version
        id: installer-version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          installer_version="$(bash ../.github/scripts/installer-version.sh "$VERSION")"
          echo "version=${installer_version}" >> "$GITHUB_OUTPUT"
          echo "The installers carry version ${installer_version}."
      - name: Test That A Release Build Ignores The Debug-Only Overrides
        env:
          MARSHAL_EXPECT_RELEASE: "1"
        run: cargo test --locked --release --test base_address --test instance_roots --test build_definition --test release_overrides --test agent_overrides
      - name: Build The Production CLI
        run: cargo build --locked --release --bin marshal
      - name: Recheck Historical Input After Build
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/cli-recovery/prepare-source.sh verify historical "$VERSION"
      - name: Check The Binary's Version
        env:
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          printed="$("${CARGO_TARGET_DIR}/release/marshal${SUFFIX}" --version | tr -d '\r')"
          if [[ "$printed" != "marshal ${VERSION}" ]]; then
            echo "error: the binary's --version printed '${printed}', not 'marshal ${VERSION}'" >&2
            exit 1
          fi
          echo "The binary prints '${printed}'."
      - name: Name The Production CLI For The Release
        id: asset
        env:
          INSTALLER_SUFFIX: ${{ matrix.installer-suffix }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          asset="marshal-${VERSION}-${TARGET}${SUFFIX}"
          mkdir ../../dist
          cp "${CARGO_TARGET_DIR}/release/marshal${SUFFIX}" "../../dist/${asset}"
          echo "name=${asset}" >> "$GITHUB_OUTPUT"
          echo "installer=marshal-${VERSION}-${TARGET}${INSTALLER_SUFFIX}" >> "$GITHUB_OUTPUT"
      - name: Check That The Windows Binary Imports No vcruntime DLL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe') | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $dumpbin) { throw 'vswhere found no dumpbin.exe for x64.' }
          $report = @(& $dumpbin /nologo /dependents (Join-Path '..\..\dist' $env:ASSET))
          if ($LASTEXITCODE -ne 0) { throw "dumpbin exited $LASTEXITCODE." }
          $report | Write-Host
          if (-not ($report -match 'Image has the following dependencies')) { throw 'dumpbin printed no dependency list.' }
          if (-not ($report -match '^\s*KERNEL32\.dll\s*$')) { throw 'dumpbin listed no KERNEL32.dll, so its output cannot be trusted.' }
          $runtime = @($report -match 'vcruntime')
          if ($runtime.Count -gt 0) { throw "The binary imports a vcruntime DLL: $($runtime -join ', ')" }
          Write-Host 'The binary imports no vcruntime DLL.'
      - name: Fetch WiX
        if: runner.os == 'Windows'
        env:
          WIX_DIRECTORY: ${{ runner.temp }}\wix
        run: bash ../.github/scripts/fetch-wix.sh "$WIX_DIRECTORY"
      - name: Build The Legacy CLI MSI
        if: runner.os == 'Windows'
        shell: powershell
        env:
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_VERSION: ${{ steps.installer-version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
          WIX_DIRECTORY: ${{ runner.temp }}\wix
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path ..\..\dist).Path
          ..\.github\scripts\build-msi.ps1 -Binary (Join-Path $dist $env:ASSET) -Version $env:INSTALLER_VERSION -Output (Join-Path $dist $env:INSTALLER) -WixDirectory $env:WIX_DIRECTORY
      - name: Build The Bare CLI Package
        if: runner.os == 'macOS'
        env:
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_VERSION: ${{ steps.installer-version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
        run: bash ../.github/scripts/build-pkg.sh "../../dist/${ASSET}" "$INSTALLER_VERSION" "../../dist/${INSTALLER}"
      - name: Test The MSI On The Hosted Runner
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: powershell
        env:
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_VERSION: ${{ steps.installer-version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
          VERSION: ${{ inputs.version }}
          WIX_DIRECTORY: ${{ runner.temp }}\wix
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Hosted installer checks are not #71 native-host evidence.'
          $dist = (Resolve-Path ..\..\dist).Path
          ..\.github\scripts\tests\test-msi-installer.ps1 -Binary (Join-Path $dist $env:ASSET) -ReleaseMsi (Join-Path $dist $env:INSTALLER) -ReleaseVersion $env:VERSION -InstallerVersion $env:INSTALLER_VERSION -WixDirectory $env:WIX_DIRECTORY -LogDirectory (Join-Path $env:RUNNER_TEMP 'installer-logs')
      - name: Test The Package On The Hosted Runner
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_VERSION: ${{ steps.installer-version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          echo 'Hosted installer checks are not #71 native-host evidence.'
          bash ../.github/scripts/tests/test-pkg-installer.sh "${PWD}/../../dist/${ASSET}" "${PWD}/../../dist/${INSTALLER}" "$VERSION" "$INSTALLER_VERSION" "${RUNNER_TEMP}/installer-logs"
      - name: Check The Signing Tools
        if: runner.os == 'macOS'
        run: |
          bin_tools="security codesign pkgbuild openssl plutil shasum xcrun lsbom sudo"
          sbin_tools="pkgutil spctl installer"
          found=""
          missing=""
          for tool in $bin_tools; do
            if [[ -x "/usr/bin/${tool}" ]]; then
              found="${found} ${tool}=/usr/bin/${tool}"
            else
              missing="${missing} /usr/bin/${tool}"
            fi
          done
          for tool in $sbin_tools; do
            if [[ -x "/usr/sbin/${tool}" ]]; then
              found="${found} ${tool}=/usr/sbin/${tool}"
            else
              missing="${missing} /usr/sbin/${tool}"
            fi
          done
          for tool in notarytool stapler; do
            path="$(/usr/bin/xcrun --find "$tool" 2>/dev/null)" || path=""
            if [[ -n "$path" ]]; then
              found="${found} ${tool}=${path}"
            else
              missing="${missing} xcrun:${tool}"
            fi
          done
          if [[ "$(printf 'dGVzdA==' | /usr/bin/openssl enc -base64 -d -A)" != "test" ]]; then
            missing="${missing} openssl:base64-decode"
          fi
          if [[ "$(/usr/bin/shasum -a 256 </dev/null)" != e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855* ]]; then
            missing="${missing} shasum:-a-256"
          fi
          echo "MEASURED: signing tools:${found}"
          if [[ -n "$missing" ]]; then
            echo "error: signing tools are missing or do not support the required flags:${missing}" >&2
            exit 1
          fi
      - name: Recheck Historical Input After Packaging And Installer Tests
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/cli-recovery/prepare-source.sh verify historical "$VERSION"
      - name: Upload The Hosted Installer Test Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marshal-cli-recovery-installer-test-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/installer-logs
          retention-days: 14
          if-no-files-found: ignore
      - name: Hash The CLI And The Installer
        id: hash
        working-directory: dist
        env:
          ASSET: ${{ steps.asset.outputs.name }}
          HASH_OUTPUT: ${{ matrix.sha256-output }}
          INSTALLER: ${{ steps.asset.outputs.installer }}
          INSTALLER_HASH_OUTPUT: ${{ matrix.installer-sha256-output }}
        run: |
          # hash_file <file> <output>: append its SHA-256 to GITHUB_OUTPUT and
          # print a checksum line; exit on an unreadable file or invalid digest.
          hash_file() {
            local line hash
            if command -v sha256sum >/dev/null 2>&1; then
              line="$(sha256sum "$1")"
            else
              line="$(shasum -a 256 "$1")"
            fi
            hash="${line%% *}"
            if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
              echo "error: '${line}' does not start with a SHA-256" >&2
              exit 1
            fi
            echo "${2}=${hash}" >> "$GITHUB_OUTPUT"
            echo "${hash}  ${1}"
          }
          hash_file "$ASSET" "$HASH_OUTPUT"
          hash_file "$INSTALLER" "$INSTALLER_HASH_OUTPUT"
      - name: Upload The Unsigned CLI And Installer
        uses: actions/upload-artifact@v7
        with:
          name: marshal-cli-recovery-${{ matrix.target }}
          path: |
            dist/${{ steps.asset.outputs.name }}
            dist/${{ steps.asset.outputs.installer }}
          if-no-files-found: error

  assemble:
    name: Assemble The Unsigned CLI Recovery Files
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: marshal-cli-recovery
    steps:
      - name: Checkout The Workflow Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download The Windows CLI Files
        uses: actions/download-artifact@v8
        with:
          name: marshal-cli-recovery-windows-x64
          path: dist
      - name: Download The macOS CLI Files
        uses: actions/download-artifact@v8
        with:
          name: marshal-cli-recovery-macos-arm64
          path: dist
      - name: Check The Hashes And Write SHA256SUMS
        env:
          VERSION: ${{ inputs.version }}
          WINDOWS_SHA256: ${{ needs.build.outputs.windows_x64_sha256 }}
          WINDOWS_MSI_SHA256: ${{ needs.build.outputs.windows_x64_msi_sha256 }}
          MACOS_SHA256: ${{ needs.build.outputs.macos_arm64_sha256 }}
          MACOS_PKG_SHA256: ${{ needs.build.outputs.macos_arm64_pkg_sha256 }}
        run: bash .github/scripts/cli-recovery/assemble-release.sh "$VERSION" dist "$WINDOWS_SHA256" "$WINDOWS_MSI_SHA256" "$MACOS_SHA256" "$MACOS_PKG_SHA256"
      - name: Upload The Unsigned CLI Recovery Files
        uses: actions/upload-artifact@v7
        with:
          name: marshal-cli-recovery
          path: dist
          if-no-files-found: error
