name: Rust Advisories

# runs cargo-deny's advisory check on the locked crates. it needs the network,
# so it is outside mise run check and not required: a new advisory turns it red
# and the maintainer triages it. the database is data, so it needs no pin. runs
# on GitHub-hosted runners only; see docs/conventions/security.md.

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - cli/Cargo.lock
      - cli/deny.toml
      - .github/workflows/rust-advisories.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  advisories:
    name: Check Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # cargo-deny reads the crate metadata, which needs the pinned toolchain.
      - name: Install Pinned Rust Toolchain
        working-directory: cli
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Pinned Tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.17
          # SHA-256 of the extracted mise binary, not of the archive the action
          # downloads. update with the version; see docs/operations/agent-sessions.md.
          sha256: 63049bc35fb9065e8dc35ac8b25fdae53e9bd6f1885a843aedeba398e046a1ee
      - name: Check Advisories
        working-directory: cli
        run: mise exec -- cargo deny --locked check advisories
