name: Merge Checks

# The repository's own CI: the format, lint, link, documentation, skills lock,
# and host configuration gates, run through the same mise task the README
# documents, plus a build of the runner image that is never pushed and a run of
# the host configuration test under Windows PowerShell 5.1. It runs on
# GitHub-hosted runners only. This repository is public, and GitHub advises
# against self-hosted runners on public repositories; see
# docs/conventions/security.md.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on pull requests only: on the default branch every push
# is a distinct merged commit whose checks must run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          # SHA-256 of the extracted mise binary, not of the archive the action
          # downloads. Update with the version; see docs/operations/agent-sessions.md.
          sha256: 63049bc35fb9065e8dc35ac8b25fdae53e9bd6f1885a843aedeba398e046a1ee
      - name: Run Checks
        run: mise run check

  image:
    name: Build Runner Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Builds only: no registry login and no push, so the job holds no
      # credential. The image is built on the runner host, not published.
      - name: Build Runner Image
        run: docker build --tag actions-runner:ci images/actions-runner
      # Checks what the host relies on, not just that the build succeeds: the
      # unprivileged user, the runner entry point, a writable tool cache, and the
      # build dependencies. Runs the image with no mounts, network, or secrets.
      - name: Smoke Test Runner Image
        run: >-
          docker run --rm --network none actions-runner:ci bash -c
          'test "$(id -un)" = runner && test -x /home/runner/run.sh &&
          test -w /opt/hostedtoolcache && ccache --version > /dev/null'

  # The host scripts must run on the Windows PowerShell 5.1 that ships with Windows
  # and that the scheduled tasks use, which the check job's PowerShell 7 does not
  # cover. This runs only the configuration test, which calls neither Docker nor
  # GitHub; Docker Desktop, Task Scheduler, and icacls are not exercised here.
  host-windows:
    name: Test Host Scripts On Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Host Configuration Test
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File hosts/windows-docker-desktop/tests/test-host-configuration.ps1
