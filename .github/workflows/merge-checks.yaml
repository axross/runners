name: Merge Checks

# the repository's own CI: the format, lint, link, documentation, skills lock,
# host configuration, and Rust gates, run through the same mise task the README
# documents, plus a build of the runner image that is never pushed, a run of the
# host configuration test under Windows PowerShell 5.1, and the CLI's format,
# lint, and tests on Linux, Windows, and macOS, with real-Docker tests and a
# release-profile test on Linux, an other-user lock test on Linux and macOS, and a
# control-pipe security test on Windows. the CLI's advisory check needs the
# network and runs in rust-advisories.yaml, which is not a required check. it runs
# on GitHub-hosted runners only. this repository is public, and GitHub advises
# against self-hosted runners on public repositories; see
# docs/conventions/security.md.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on pull requests only: on the default branch every push
# is a distinct merged commit whose checks must run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          # SHA-256 of the extracted mise binary, not of the archive the action
          # downloads. Update with the version; see docs/operations/agent-sessions.md.
          sha256: 63049bc35fb9065e8dc35ac8b25fdae53e9bd6f1885a843aedeba398e046a1ee
      # the Rust gates in mise run check need the toolchain that
      # cli/rust-toolchain.toml pins. rustup is on the hosted runner; naming no
      # toolchain installs the one the file names, so the pin lives in one place. a
      # rustup older than 1.28 cannot run toolchain install without a name, so
      # show active-toolchain comes first.
      - name: Install Pinned Rust Toolchain
        working-directory: cli
        run: rustup show active-toolchain || rustup toolchain install
      - name: Run Checks
        run: mise run check

  # the CLI on each operating system a runner host can be: format, lint, and tests.
  # the parity test needs PowerShell 7 and the pinned mise tools, so it runs in the
  # check job on Linux only. three more steps run on Linux only: the release-profile
  # tests of the debug-only overrides and the two real-Docker tests. no cache action:
  # a cache would be a trust boundary for a job that builds code, and the build is
  # small.
  rust:
    name: Test CLI On ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Rust Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Check Formatting
        run: cargo fmt --check
      - name: Lint With Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Tests
        run: cargo test --locked
      # another OS user must be refused the instance lock while it is held. the
      # script copies the debug helper to a directory under /tmp that the `nobody`
      # account can reach, holds the lock in a debug-only root there, and runs the
      # copy as nobody through sudo, which the Linux and macOS hosted runners allow
      # without a password. a hosted Windows runner has one account, so it has no
      # such step.
      - name: Test That Another User Cannot Take The Instance Lock
        if: runner.os != 'Windows'
        run: |
          cargo build --locked --bin instance-helper
          bash tests/ci/other-user-lock.sh target/debug/instance-helper
      # the CLI cannot read a live pipe's security descriptor without unsafe code,
      # so PowerShell reads it from a client handle to the control pipe the debug
      # helper opens, and fails unless it grants the current user alone.
      - name: Read Back The Control Pipe Security Descriptor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --bin instance-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/ci/control-pipe-security.ps1 -Helper target/debug/instance-helper.exe
      # the GitHub API base address, the instance's roots and the image definition
      # `build` sends can move only in a debug build, for the tests. the plain test
      # run above is a debug build, so this step builds the same tests in the
      # release profile and shows that none of them moves. MARSHAL_EXPECT_RELEASE
      # makes each test fail if it was built in the wrong profile, so a mistake in
      # this step cannot pass quietly.
      - name: Test That A Release Build Ignores The Debug-Only Overrides
        if: runner.os == 'Linux'
        env:
          MARSHAL_EXPECT_RELEASE: "1"
        run: cargo test --locked --release --test base_address --test instance_roots --test build_definition
      # the real-Docker tests need the runner image's base stage, which is digest
      # pinned, and a daemon: ubuntu-latest has one, and the Windows and macOS
      # hosted runners have no Linux daemon. one runs a container and the CPU probe
      # through the backend; the other exports a container's small metrics file
      # through the CLI's exporter child from a real `docker cp` stream into a
      # private temporary sink. a missing daemon or image fails each test, so it
      # cannot be skipped without anyone seeing. the image is built on the runner
      # host and never pushed, so the job holds no credential.
      - name: Build Runner Base Image For The Docker Test
        if: runner.os == 'Linux'
        run: docker build --target base --tag runners-docker-test:ci ../images/actions-runner
      - name: Run Real Docker Test
        if: runner.os == 'Linux'
        env:
          MARSHAL_REAL_DOCKER_IMAGE: runners-docker-test:ci
        run: cargo test --locked --test real_docker -- --ignored
      # `marshal build` against the same daemon, with the debug-only test
      # definition in tests/build-definition: the runner image's digest-pinned base
      # and its contract labels, so the step shows the builder takes build's
      # context and labels without building the whole image. a missing daemon fails
      # the test, and the image it builds is removed and never pushed.
      - name: Run Real Docker Build Test
        if: runner.os == 'Linux'
        run: cargo test --locked --test real_docker_build -- --ignored

  image:
    name: Build Runner Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify NDK Download Rejection
        run: bash images/actions-runner/tests/check-download.sh
      # builds only: no registry login and no push, so the job holds no
      # credential. the image is built on the runner host, not published.
      - name: Build Runner Image
        run: docker build --tag actions-runner:ci images/actions-runner
      # no network or shared mounts can mask an incomplete image or a toolchain
      # modified by an earlier job.
      - name: Smoke Test Runner Image
        run: bash images/actions-runner/tests/smoke-test.sh actions-runner:ci

  # the host scripts target the Windows PowerShell 5.1 that ships with Windows
  # and that the scheduled tasks use, which the check job's PowerShell 7 does not
  # cover. this runs only the configuration test, which calls neither Docker nor
  # GitHub; Docker Desktop, Task Scheduler, and icacls are not exercised here.
  host-windows:
    name: Test Host Scripts On Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Host Configuration Test
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File hosts/windows-docker-desktop/tests/test-host-configuration.ps1
