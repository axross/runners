name: Merge Checks

# the repository's own CI: the gates behind mise run check, the CLI tests on
# Linux, Windows, and macOS, the app's build on Windows and its mode dispatch on
# macOS, the image build and smoke test on amd64 and arm64, the release dry run,
# and the documented install blocks against the dry run's installers. GitHub-hosted
# runners only, because this repository is public; see docs/conventions/security.md.

on:
  pull_request:
  push:
    branches: [main]

# cancel superseded runs on pull requests only; every push to the default
# branch must run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.17
          # SHA-256 of the extracted mise binary, not of the archive the action
          # downloads. update with the version; see docs/operations/agent-sessions.md.
          sha256: 63049bc35fb9065e8dc35ac8b25fdae53e9bd6f1885a843aedeba398e046a1ee
      # rustup is on the hosted runner; naming no toolchain installs the one
      # cli/rust-toolchain.toml pins. a rustup older than 1.28 cannot do that
      # without a name, so show active-toolchain comes first.
      - name: Install Pinned Rust Toolchain
        working-directory: cli
        run: rustup show active-toolchain || rustup toolchain install
      - name: Run Checks
        run: mise run check

  # no cache action: a cache would be a trust boundary for a job that builds
  # code, and the build is small.
  rust:
    name: Test CLI On ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Rust Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Check Formatting
        run: cargo fmt --check
      - name: Lint With Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Tests
        run: cargo test --locked
      # another OS user must be refused the instance lock while it is held. the
      # script runs the debug helper as `nobody` through sudo, which the Linux and
      # macOS hosted runners allow without a password; a hosted Windows runner has
      # one account, so it has no such step.
      - name: Test That Another User Cannot Take The Instance Lock
        if: runner.os != 'Windows'
        run: |
          cargo build --locked --bin instance-helper
          bash tests/ci/other-user-lock.sh target/debug/instance-helper
      # the CLI cannot read a live pipe's security descriptor without unsafe code,
      # so PowerShell reads it and fails unless it grants the current user alone.
      - name: Read Back The Control Pipe Security Descriptor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --bin instance-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/ci/control-pipe-security.ps1 -Helper target/debug/instance-helper.exe
      # the debug-only overrides move only in a debug build; this builds the same
      # tests in the release profile. MARSHAL_EXPECT_RELEASE makes each test fail
      # if built in the wrong profile, so a mistake here cannot pass quietly.
      - name: Test That A Release Build Ignores The Debug-Only Overrides
        if: runner.os == 'Linux'
        env:
          MARSHAL_EXPECT_RELEASE: "1"
        run: cargo test --locked --release --test base_address --test instance_roots --test build_definition --test release_overrides --test agent_overrides
      # the real-Docker tests need the base stage and a daemon; the Windows and macOS
      # hosted runners have no Linux daemon, and a missing daemon or image fails each
      # test, so it cannot be skipped unseen. the image is never pushed, so the job
      # holds no credential.
      - name: Build Runner Base Image For The Docker Test
        if: runner.os == 'Linux'
        run: docker build --target base --tag runners-docker-test:ci ../images/actions-runner
      - name: Run Real Docker Test
        if: runner.os == 'Linux'
        env:
          MARSHAL_REAL_DOCKER_IMAGE: runners-docker-test:ci
        run: cargo test --locked --test real_docker -- --ignored
      # `marshal build` against the same daemon, with the debug-only test definition
      # in tests/build-definition. a missing daemon fails the test, and the image it
      # builds is removed and never pushed.
      - name: Run Real Docker Build Test
        if: runner.os == 'Linux'
        run: cargo test --locked --test real_docker_build -- --ignored

  # the mode dispatch, including the Unix shims, on macOS: the app's crate for it builds
  # without the web view, so this job never builds the Tauri crate. Linux runs the same
  # tests in mise run check. no cache action, for the reason the rust job gives.
  app-modes:
    name: Test App Modes On macOS
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Rust Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Lint The Mode Dispatch With Clippy
        run: cargo clippy --locked --package marshal-modes --all-targets -- -D warnings
      - name: Test The Mode Dispatch
        run: cargo test --locked --package marshal-modes
      # the debug-only variables move the agent only in a debug build; this builds the
      # same tests in the release profile, which is the only profile that runs the
      # test that a release build ignores them. MARSHAL_EXPECT_RELEASE makes a test
      # fail if built in the wrong profile, as in the rust job's step of the same kind,
      # so a dropped --release cannot pass quietly. the three variables are set so that
      # the test that a release build ignores them fails if it does not.
      - name: Test That A Release Build Ignores The Debug-Only Variables
        env:
          MARSHAL_EXPECT_RELEASE: "1"
          MARSHAL_TEST_ROOT: /nonexistent/marshal-test-root
          MARSHAL_TEST_DOCKER: /nonexistent/docker
          MARSHAL_TEST_GITHUB_API: http://127.0.0.1:9
        run: cargo test --locked --release --package marshal-modes

  # the app's whole workspace, which needs the Windows web view and so cannot run in
  # mise run check. `tauri-cli` is installed from source at the pin in
  # app/tauri-cli.version, the one place the pin is set, so it compiles on every run.
  # no cache action, for the reason the rust job gives. docs/operations/app.md records
  # how the timeout was set.
  app:
    name: Build App On Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Rust Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install tauri-cli At The Pin
        run: |
          version="$(bash ../.github/scripts/tauri-cli-version.sh)"
          cargo install tauri-cli --version "=${version}" --locked --root "${RUNNER_TEMP}/tauri-cli"
          echo "${RUNNER_TEMP}/tauri-cli/bin" >> "$GITHUB_PATH"
      - name: Lint With Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Tests
        run: cargo test --locked --workspace --no-fail-fast
      - name: Build The App
        working-directory: app/crates/app
        run: cargo tauri build --no-bundle
      # the manifest carries the feature lists tauri-cli would write, and the
      # generated permission files are checked in, so a build changes nothing.
      - name: Fail If The Build Changed A Tracked File
        run: |
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard --full-name -- :/)"
          if [[ -n "$untracked" ]]; then
            echo "error: the build left files that are neither tracked nor ignored:" >&2
            echo "$untracked" >&2
            exit 1
          fi
      - name: Keep The Built App
        uses: actions/upload-artifact@v7
        with:
          name: marshal-app-windows
          path: app/target/release/marshal-app.exe
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # the same reusable workflow release.yaml calls, at a dry-run version; it
  # publishes and attests nothing.
  release-build:
    name: Release Build Dry Run
    uses: ./.github/workflows/release-build.yaml
    permissions:
      contents: read
    with:
      version: 0.0.0-dryrun.${{ github.run_number }}

  # the install, check, migration, and uninstall blocks of docs/operations/cli.md,
  # extracted from the document: first against stand-ins, then against the dry
  # run's real installers with only gh stubbed. it downloads the dry run's artifact
  # and holds contents: read; nothing is attested or published.
  install-blocks:
    name: Install Blocks On ${{ matrix.os }}
    needs: release-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      RELEASE_VERSION: 0.0.0-dryrun.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download The Dry Run's Release Files
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-build.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - name: Run The macOS Blocks Against Stand-Ins Under zsh
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: bash .github/scripts/tests/test-install-blocks.sh zsh
      - name: Run The macOS Blocks Against Stand-Ins Under The System bash
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: bash .github/scripts/tests/test-install-blocks.sh /bin/bash
      # the real installer and passwordless sudo, with only gh stubbed.
      - name: Run The macOS Blocks Against The Dry Run Package Under zsh
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: bash .github/scripts/tests/test-install-blocks-real.sh zsh "${RUNNER_TEMP}/release" "$RELEASE_VERSION"
      - name: Run The macOS Blocks Against The Dry Run Package Under The System bash
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: bash .github/scripts/tests/test-install-blocks-real.sh /bin/bash "${RUNNER_TEMP}/release" "$RELEASE_VERSION"
      - name: Run The Windows Blocks Against Stand-Ins Under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: powershell
        run: .\.github\scripts\tests\test-install-blocks.ps1
      - name: Run The Windows Blocks Against Stand-Ins Under PowerShell 7
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: ./.github/scripts/tests/test-install-blocks.ps1
      - name: Run The Windows Blocks Against The Dry Run MSI
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: powershell
        run: .\.github\scripts\tests\test-install-blocks-real.ps1 -ReleaseDirectory (Join-Path $env:RUNNER_TEMP 'release') -Version $env:RELEASE_VERSION -LogDirectory (Join-Path $env:RUNNER_TEMP 'install-block-logs')
      # the hosted runner is elevated, so a standard local user runs the check
      # block's extraction and the install, and the outcome is a MEASURED line.
      - name: Run The Check Block And The Install As A Standard User
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: powershell
        run: .\.github\scripts\tests\test-msi-standard-user.ps1 -ReleaseDirectory (Join-Path $env:RUNNER_TEMP 'release') -Version $env:RELEASE_VERSION
      - name: Upload The Install Block Logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: install-block-logs-windows
          path: ${{ runner.temp }}/install-block-logs
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  image:
    name: Build Runner Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify NDK Download Rejection
        run: bash images/actions-runner/tests/check-download.sh
      # no registry login and no push, so the job holds no credential.
      - name: Build Runner Image
        run: docker build --tag actions-runner:ci images/actions-runner
      # no network or shared mounts can mask an incomplete image or a toolchain
      # modified by an earlier job.
      - name: Smoke Test Runner Image
        run: bash images/actions-runner/tests/smoke-test.sh actions-runner:ci

  # the same build and smoke test on the hosted Linux arm64 runner, where the
  # image has no Android toolchain: the axmc golden VM builds this Dockerfile for
  # linux/arm64. no registry login and no push, so the job holds no credential.
  image-arm64:
    name: Build Runner Image On Arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Runner Image
        run: docker build --platform linux/arm64 --tag actions-runner:ci-arm64 images/actions-runner
      - name: Smoke Test Runner Image
        run: bash images/actions-runner/tests/smoke-test.sh actions-runner:ci-arm64
