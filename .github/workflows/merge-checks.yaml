name: Merge Checks

# The repository's own CI: the format, lint, link, documentation, and skills
# lock gates, run through the same mise task the README documents. It runs on a
# GitHub-hosted runner only. This repository is public, and GitHub advises
# against self-hosted runners on public repositories; see
# docs/conventions/security.md.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on pull requests only: on the default branch every push
# is a distinct merged commit whose checks must run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Pinned Tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          # SHA-256 of the extracted mise binary, not of the archive the action
          # downloads. Update with the version; see docs/operations/agent-sessions.md.
          sha256: 63049bc35fb9065e8dc35ac8b25fdae53e9bd6f1885a843aedeba398e046a1ee
      - name: Run Checks
        run: mise run check
