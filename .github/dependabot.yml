version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"

  # No "docker" entry yet: it is added in the change that introduces the first
  # Dockerfile under images/<name>/, with one directory per image. The tools
  # pinned in mise.toml are not covered by Dependabot and are refreshed by hand.
