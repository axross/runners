version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"

  # One entry per image directory under images/. The tools pinned in mise.toml
  # are not covered by Dependabot and are refreshed by hand.
  - package-ecosystem: "docker"
    directory: "/images/actions-runner"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
