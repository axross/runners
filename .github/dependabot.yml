version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"

  # one entry per image directory under images/; the tools pinned in mise.toml
  # are not covered by Dependabot and are refreshed by hand.
  - package-ecosystem: "docker"
    directory: "/images/actions-runner"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  # the CLI's crates and toolchain, both under cli/. the rustup-init pin in
  # .agents/install-rust is refreshed by hand with its checksum.
  - package-ecosystem: "cargo"
    directory: "/cli"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "rust-toolchain"
    directory: "/cli"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  # semantic-release and its plugins, which release.yaml installs from
  # release/package-lock.json. the prefix is `chore` because their bumps change
  # nothing in a binary; the `build(deps)` prefix above releases a patch
  # (release/.releaserc.json).
  - package-ecosystem: "npm"
    directory: "/release"
    schedule:
      interval: "weekly"
    # the 10.x preset needs conventional-changelog-writer 9, and the notes
    # generator still uses 8. lift this when the generator moves to writer 9.
    ignore:
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">=10"]
    commit-message:
      prefix: "chore"
      include: "scope"
