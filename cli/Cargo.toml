[workspace]
resolver = "3"
members = ["."]

[package]
name = "marshal-cli"
version = "0.0.0-dev"
edition = "2024"
description = "Management CLI for the self-hosted runner hosts in this repository"
publish = false
default-run = "marshal"

[lib]
name = "marshal_cli"
path = "src/lib.rs"

# the binary name is fixed: the instance lock, control channel, and log names
# derive from it, so renaming it breaks every installed host; see
# docs/operations/cli.md.
[[bin]]
name = "marshal"
path = "src/main.rs"

# a stand-in for the `docker` client, so the tests can run the container backend as
# a real process. Windows finds only `.exe` programs, so it cannot be a script.
[[bin]]
name = "fake-docker"
path = "helpers/fake_docker.rs"
test = false
doc = false

# a stand-in for a second process, for the lock and channel tests and the CI step
# that runs it as another user. a release must not ship it.
[[bin]]
name = "instance-helper"
path = "helpers/instance_helper.rs"
test = false
doc = false

# `serde` is declared without its default features: its derive runs procedural
# macros (`serde_derive`, `syn`, `quote`, `proc-macro2`) at build time, and the
# JSON reader is in this crate.
[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "io-util", "process", "macros", "net", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

# the instance lock and control channel are named pipes on Windows: interprocess
# owns the pipe calls, winsafe reads the current user's SID, and win32job puts
# `start` in a Job Object that kills its children when it ends.
[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4.7", default-features = false }
winsafe = { version = "0.0.29", default-features = false, features = ["advapi"] }
win32job = { version = "2.0.3", default-features = false }

# the Unix lock opens its file with O_NOFOLLOW and O_NONBLOCK, which std does not
# name. tokio already depends on libc, so this adds no crate.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", default-features = false }

[lints.rust]
unsafe_code = "forbid"

# a configuration file is untrusted input: no path through the validator may panic.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
