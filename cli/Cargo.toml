[workspace]
resolver = "3"
members = ["."]

[package]
name = "runners-cli"
version = "0.1.0"
edition = "2024"
description = "Management CLI for the self-hosted runner hosts in this repository"
publish = false
default-run = "runners"

[lib]
name = "runners_cli"
path = "src/lib.rs"

# The binary name is the CLI's provisional name; the CLI operations document keeps
# the checklist of everything that changes with it.
[[bin]]
name = "runners"
path = "src/main.rs"

# A stand-in for the `docker` client, built so the tests can run the container backend
# as a real process. Windows finds only `.exe` programs, so it cannot be a script.
[[bin]]
name = "fake-docker"
path = "helpers/fake_docker.rs"
test = false
doc = false

# A stand-in for a second process, for the lock and channel tests and the CI step that
# runs it as another user. Like fake-docker it is for tests; a release must not ship it.
[[bin]]
name = "instance-helper"
path = "helpers/instance_helper.rs"
test = false
doc = false

# serde is declared without its default features. Its derive feature runs
# procedural macros (serde_derive, syn, quote, proc-macro2) at build time, and the
# JSON reader is in this crate, so there is no JSON parser dependency.
[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "io-util", "process", "macros", "net", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

# The single-instance lock and the control channel are named pipes on Windows, where
# interprocess owns the pipe calls and winsafe reads the current user's SID, and win32job
# puts `start` in a Job Object that kills its children when it ends. Unix needs none of
# them: std and tokio cover its lock and socket, and a shim contains its children.
[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4.7", default-features = false }
winsafe = { version = "0.0.29", default-features = false, features = ["advapi"] }
win32job = { version = "2.0.3", default-features = false }

# The Unix lock opens its file with O_NOFOLLOW and O_NONBLOCK, which std does not
# name. tokio already depends on libc, so this adds no crate.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", default-features = false }

[lints.rust]
unsafe_code = "forbid"

# A configuration file is untrusted input: no path through the validator may panic.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
