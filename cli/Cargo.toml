[workspace]
resolver = "3"
members = ["."]

[package]
name = "runners-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Management CLI for the self-hosted runner hosts in this repository"
publish = false

[lib]
name = "runners_cli"
path = "src/lib.rs"

# The binary name is the CLI's provisional name; the CLI operations document keeps
# the checklist of everything that changes with it.
[[bin]]
name = "runners"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }

[lints.rust]
unsafe_code = "forbid"

# A configuration file is untrusted input: no path through the validator may panic.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
