# cargo-deny policy for the CLI. `mise run deny:rust` runs the bans, licenses and
# sources checks, which read the crate metadata `cargo fetch --locked` provides
# and need no advisory database. The advisory check fetches the RustSec database,
# so it runs in its own workflow (.github/workflows/rust-advisories.yaml), not here.
# docs/operations/cli.md records why each allowed licence and each crate is accepted.
# serde brings serde_derive and syn, which run at build time, and unicode-ident, whose
# licence expression needs Unicode-3.0. The HTTPS client brings rustls-webpki, untrusted
# and ring, whose licences need ISC, and subtle, which needs BSD-3-Clause, and its URL
# parser brings the proc-macro crates displaydoc, yoke-derive, zerofrom-derive and
# zerovec-derive; tokio-macros comes with the async runtime's macros. The Windows pipe crate,
# interprocess, brings doctest-file (a procedural-macro crate) and recvmsg, whose licence is
# 0BSD; its other dependency, widestring, is MIT OR Apache-2.0.

[graph]
# The three operating systems the CLI is built and tested on in CI.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "0BSD"]
confidence-threshold = 0.93
# The CLI itself is unpublished and carries no licence field.
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
