# cargo-deny policy for the CLI. `mise run deny:rust` runs the bans, licenses and
# sources checks, which need no advisory database; the advisory check fetches
# the RustSec database, so it runs in .github/workflows/rust-advisories.yaml.
# docs/operations/cli.md records why each allowed licence and each crate is
# accepted.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "0BSD"]
confidence-threshold = 0.93
# the CLI itself is unpublished and carries no licence field.
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# each skip lets one older version be built beside the current one, on Windows only.
skip = [
  { crate = "syn:^2", reason = "thiserror-impl 1, windows-implement and windows-interface, under win32job, use syn 2, while every other derive uses syn 3" },
  { crate = "windows-link:^0.1", reason = "the windows 0.61 family under win32job uses windows-link 0.1, while windows-sys 0.61 uses 0.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
