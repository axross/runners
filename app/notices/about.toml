# cargo-about's configuration for the app's licence notices; generate.sh runs it and
# docs/operations/app.md describes the notices. The licences accepted are the ones
# ../deny.toml allows or excepts, so a crate under another licence stops both.
accepted = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "ISC",
  "BSD-3-Clause",
  "0BSD",
  "MPL-2.0",
  "Zlib",
]

# the executable links neither the build scripts' crates nor the tests'.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# the app's own crates are unpublished and carry no licence field.
private = { ignore = true }

# the crates below ship their licence files, but cargo-about does not read the
# copyright line from them on its own and would print the licence's template line
# instead. each clarification names the crate's own files with a checksum, which
# stops matching when a new version changes them and brings the template line back.

[windows-collections.clarify]
license = "MIT OR Apache-2.0"
[[windows-collections.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"
[[windows-collections.clarify.files]]
path = "license-apache-2.0"
license = "Apache-2.0"
checksum = "c16f8dcf1a368b83be78d826ea23de4079fe1b4469a0ab9ee20563f37ff3d44b"

