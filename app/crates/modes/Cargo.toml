[package]
name = "marshal-modes"
description = "The modes the one Marshal executable runs in, decided before the app starts"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
marshal-cli = { path = "../../../cli" }

# keeps Windows awake for the agent, which the library's policy does not admit.
[target.'cfg(windows)'.dependencies]
keepawake = { version = "0.6.1", default-features = false }

[lints]
workspace = true
