[package]
name = "marshal-session"
description = "The app's session with its agent: connecting to it, starting it, keeping the view current, and the commands the windows give"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
marshal-cli = { path = "../../../cli" }
marshal-feed = { path = "../feed" }
marshal-modes = { path = "../modes" }
marshal-view = { path = "../view" }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# the session's timers and its one task; the version is the one the library already
# builds, so this adds no crate.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "macros", "test-util"] }

[lints]
workspace = true
