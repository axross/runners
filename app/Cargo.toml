[workspace]
resolver = "3"
members = ["crates/modes"]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
publish = false

# the CLI's lint set; every crate takes it with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
