# cargo-deny policy for the app's workspace, which covers everything the
# executable links, `marshal-cli` and its crates included. `mise run deny:app` runs
# the bans, licenses and sources checks, which need no advisory database;
# docs/conventions/security.md records why each licence and exception is accepted.

[graph]
# the two operating systems the app is built for; the Linux build is for local
# development only and is not checked.
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "0BSD"]
confidence-threshold = 0.93
# the app's own crates are unpublished and carry no licence field.
private = { ignore = true }
# each exception names one crate, so a new crate under either licence fails the check.
# MPL-2.0 is file-level copyleft, and the crates are linked unmodified.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "foldhash", allow = ["Zlib"] },
]

# duplicate versions are reported, not denied: Tauri's tree carries many, and each
# would need a skip that the next Tauri release changes.
[bans]
multiple-versions = "warn"
wildcards = "deny"
# the app's crates and `marshal-cli` are path dependencies of each other.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
