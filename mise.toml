# pins the lint and format toolchain, so a local run and CI use the same tool
# versions; README.md documents the tasks and docs/operations/agent-sessions.md
# the hooks that call them. cli/rust-toolchain.toml pins the Rust toolchain and
# .agents/install-rust provisions it, so it is not a mise tool.

[tools]
# release.yaml installs this Node with actions/setup-node, which Dependabot does not
# bump; change its two node-version pins with this one.
node = "24.21.0"
"npm:prettier" = "3.9.9"
"npm:markdownlint-cli2" = "0.23.3"
shellcheck = "0.11.0"
hadolint = "2.15.1"
actionlint = "1.7.12"
powershell = "7.6.6"
cargo-deny = "0.20.2"

[env]
# PSScriptAnalyzer is a PowerShell module, not a mise tool, so `lint:powershell`
# downloads this version from the PowerShell Gallery on first use and refuses it
# unless its SHA-256 matches. refresh the version and the hash together.
PSSCRIPTANALYZER_VERSION = "1.25.0"
PSSCRIPTANALYZER_SHA256 = "14e634c828eb98efb9f40b2918ba90f139ed5eccdf663a2a747736d996995d60"

[tasks."rust:require"]
description = "Fail at once, with one line, when the pinned Rust toolchain is not available"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# --check installs nothing: the fix is the provisioning script, and a gate must
# not start a long install.
if ! .agents/install-rust --check; then
  echo "error: cargo, rustfmt or clippy for the toolchain in cli/rust-toolchain.toml is not available; run .agents/install-rust and put ~/.cargo/bin on PATH." >&2
  exit 1
fi
'''

[tasks."fetch:rust"]
description = "Fetch the crates in cli/Cargo.lock, which cargo test and cargo deny read"
depends = ["rust:require"]
dir = "cli"
run = "cargo fetch --locked"

[tasks."build:rust"]
description = "Build the CLI's debug binary, which the parity test runs"
depends = ["rust:require", "fetch:rust"]
dir = "cli"
run = "cargo build --locked"

[tasks."format:rust"]
description = "Rewrite the CLI's Rust files with rustfmt"
depends = ["rust:require"]
dir = "cli"
run = "cargo fmt"

[tasks."format:check:rust"]
description = "Fail when rustfmt would change a Rust file"
depends = ["rust:require"]
dir = "cli"
run = "cargo fmt --check"

[tasks."lint:rust"]
description = "Lint the CLI with clippy, warnings as errors"
depends = ["rust:require", "fetch:rust"]
dir = "cli"
run = "cargo clippy --locked --all-targets -- -D warnings"

[tasks."test:rust"]
description = "Run the CLI's unit and integration tests, which read the shared fixtures"
depends = ["rust:require", "fetch:rust"]
dir = "cli"
run = "cargo test --locked"

[tasks."deny:rust"]
description = "Check the CLI's crates for banned or duplicate versions, unreviewed licences, and other sources; the advisory check runs in its own workflow"
depends = ["rust:require", "fetch:rust"]
dir = "cli"
run = "cargo deny --locked check bans licenses sources"

[tasks."test:parity"]
description = "Check the Rust validator against the PowerShell one on the shared fixtures, after its self-test"
depends = ["build:rust"]
run = "pwsh -NoProfile -NonInteractive -File tests/host-configuration/parity.ps1"

[tasks.format]
description = "Rewrite Markdown, JSON, YAML, and TypeScript files with Prettier, and Rust files with rustfmt"
depends = ["format:rust"]
run = "prettier --write ."

[tasks."format:check"]
description = "Fail when Prettier or rustfmt would change a file"
depends = ["format:check:rust"]
run = "prettier --check ."

[tasks."lint:markdown"]
description = "Lint Markdown with markdownlint-cli2"
run = "markdownlint-cli2 \"**/*.md\""

[tasks."lint:shell"]
description = "Lint shell scripts (*.sh, .agents/setup, and .agents/install-rust) with shellcheck"
run = '''
#!/usr/bin/env bash
set -euo pipefail
files=()
while IFS= read -r file; do
  files+=("$file")
done < <(git ls-files --cached --others --exclude-standard -- '*.sh' '.agents/setup' '.agents/install-rust' ':!:.claude/skills')
if [ -z "${files[*]-}" ]; then
  echo "No shell scripts to lint."
  exit 0
fi
shellcheck "${files[@]}"
'''

[tasks."lint:docker"]
description = "Lint Dockerfiles with hadolint; passes when there are none"
run = '''
#!/usr/bin/env bash
set -euo pipefail
files=()
while IFS= read -r file; do
  files+=("$file")
done < <(git ls-files --cached --others --exclude-standard -- '*Dockerfile' '*Dockerfile.*' '*.dockerfile' ':!:.claude/skills')
if [ -z "${files[*]-}" ]; then
  echo "No Dockerfiles to lint."
  exit 0
fi
hadolint "${files[@]}"
'''

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks."lint:powershell"]
description = "Lint PowerShell scripts with PSScriptAnalyzer; passes when there are none"
run = '''
#!/usr/bin/env bash
set -euo pipefail
files=()
while IFS= read -r file; do
  files+=("$file")
done < <(git ls-files --cached --others --exclude-standard -- '*.ps1' '*.psm1' '*.psd1' ':!:.claude/skills')
if [ -z "${files[*]-}" ]; then
  echo "No PowerShell scripts to lint."
  exit 0
fi
PSSCRIPTANALYZER_FILES="$(printf '%s\n' "${files[@]}")" pwsh -NoProfile -NonInteractive -Command '
  $ErrorActionPreference = "Stop"
  $version = $env:PSSCRIPTANALYZER_VERSION
  $expected = $env:PSSCRIPTANALYZER_SHA256.ToLowerInvariant()
  # keyed by version and hash, so changing the pin installs and verifies afresh.
  $root = Join-Path $HOME ".cache/runners/PSScriptAnalyzer-$version-$expected"
  $manifest = Join-Path $root "PSScriptAnalyzer.psd1"
  if (-not (Test-Path -LiteralPath $manifest)) {
    # per-process name in the user cache, not a fixed name in the shared temp
    # directory, so another local user or run cannot swap or collide with it.
    New-Item -ItemType Directory -Force -Path (Split-Path -Parent $root) | Out-Null
    $package = "$root.$PID.nupkg"
    Invoke-WebRequest -Uri "https://www.powershellgallery.com/api/v2/package/PSScriptAnalyzer/$version" -OutFile $package
    $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()
    if ($actual -ne $expected) {
      Remove-Item -LiteralPath $package -Force
      throw "SHA-256 mismatch for PSScriptAnalyzer $version (expected $expected, got $actual); refusing to use it."
    }
    # extract only the module: the NuGet packaging entries are not part of it, and
    # the compatibility profiles are large and unused by the rules this task enables.
    Add-Type -AssemblyName System.IO.Compression.FileSystem
    $staging = "$root.partial"
    if (Test-Path -LiteralPath $staging) { Remove-Item -LiteralPath $staging -Recurse -Force }
    $archive = [IO.Compression.ZipFile]::OpenRead($package)
    try {
      foreach ($entry in $archive.Entries) {
        $name = $entry.FullName
        if ($name.EndsWith("/") -or $name -like "_rels/*" -or $name -like "package/*" -or $name -like "compatibility_profiles/*" -or $name -eq "[Content_Types].xml" -or $name -like "*.nuspec") { continue }
        $target = Join-Path $staging $name
        New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
        [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
      }
    } finally {
      $archive.Dispose()
      Remove-Item -LiteralPath $package -Force
    }
    Move-Item -LiteralPath $staging -Destination $root
  }
  Import-Module -Name $manifest -Force
  $paths = $env:PSSCRIPTANALYZER_FILES -split "\r?\n" | Where-Object { $_ }
  # targets Windows PowerShell 5.1 syntax; see the settings file for why.
  $settings = Join-Path (Get-Location) ".config/PSScriptAnalyzerSettings.psd1"
  # a settings file that stopped enabling the rule would lint clean, so each
  # construct that only PowerShell 7 parses must still be reported before the
  # result below can be trusted.
  $sevenOnly = @(
    "`$x = `$true ? 1 : 2",
    "Get-Item . && Get-Item .",
    "`$x = `$null ?? 1"
  )
  foreach ($sample in $sevenOnly) {
    $reported = @(Invoke-ScriptAnalyzer -ScriptDefinition $sample -Settings $settings | Where-Object { $_.RuleName -eq "PSUseCompatibleSyntax" })
    if ($reported.Count -eq 0) {
      throw "PSUseCompatibleSyntax did not flag a PowerShell 7 construct ($sample); the settings no longer enforce 5.1 syntax."
    }
  }
  $findings = @($paths | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error -Settings $settings })
  if ($findings.Count -gt 0) {
    $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
    exit 1
  }
  Write-Host "PSScriptAnalyzer: no findings in $($paths.Count) file(s)."
'
'''

[tasks.lint]
description = "Run every linter"
depends = [
  "lint:markdown",
  "lint:shell",
  "lint:docker",
  "lint:actions",
  "lint:powershell",
  "lint:rust",
]

[tasks."check:links"]
description = "Check relative links in the agent-facing Markdown, the docs, and the image and host READMEs"
run = "node .claude/skills/agent-skill-authoring/scripts/check-links.mjs .claude/agents docs images hosts README.md AGENTS.md CLAUDE.md REVIEW.md"

[tasks."check:docs"]
description = "Run the living-project-documentation validators over docs/"
run = '''
#!/usr/bin/env bash
# no -e: run every validator and report all failures, not only the first.
set -uo pipefail
failed=0
for check in .claude/skills/living-project-documentation/scripts/check-*.mjs; do
  echo "::group::$(basename "$check")"
  node "$check" || failed=1
  echo "::endgroup::"
done
exit "$failed"
'''

[tasks."check:amp"]
description = "Run the Amp quality-hooks plugin's smoke test with Node's test runner"
run = "node --test .amp/tests/quality-hooks.test.ts"

[tasks."check:skills"]
description = "Check that skills-lock.json and .claude/skills/ list the same skills"
run = '''
node -e '
const fs = require("node:fs");
const locked = Object.keys(JSON.parse(fs.readFileSync("skills-lock.json", "utf8")).skills).sort();
const installed = fs
  .readdirSync(".claude/skills", { withFileTypes: true })
  .filter((entry) => entry.isDirectory())
  .map((entry) => entry.name)
  .sort();
const missing = locked.filter((name) => !installed.includes(name));
const extra = installed.filter((name) => !locked.includes(name));
for (const name of missing) console.error(`locked but not installed: ${name}`);
for (const name of extra) console.error(`installed but not locked: ${name}`);
if (missing.length || extra.length) process.exit(1);
console.log(`skills-lock.json and .claude/skills/ agree (${locked.length} skills).`);
'
'''

[tasks."test:host"]
description = "Check the Windows host configuration validation against its fixtures and the example"
run = "pwsh -NoProfile -NonInteractive -File hosts/windows-docker-desktop/tests/test-host-configuration.ps1"

[tasks."test:set-release-version"]
description = "Check the script that writes the release version into the CLI's Cargo.toml and Cargo.lock"
run = "bash .github/scripts/tests/test-set-release-version.sh"

[tasks."test:verify-release"]
description = "Check the release gate that semantic-release runs before it tags and publishes"
run = "bash .github/scripts/tests/test-verify-release.sh"

[tasks.check]
description = "Run every gate: format check, lint, link check, docs validators, skills lock, Amp plugin test, host test, release script tests, Rust tests, Rust dependency check, parity test"
depends = [
  "format:check",
  "lint",
  "check:links",
  "check:docs",
  "check:skills",
  "check:amp",
  "test:host",
  "test:set-release-version",
  "test:verify-release",
  "test:rust",
  "deny:rust",
  "test:parity",
]
